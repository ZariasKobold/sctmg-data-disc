<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCTMG Data Disc</title>
<meta name="description" content="Unofficial companion for StarCraft: Tabletop Miniatures Game: army builder, game setup, battle tracker and card reference.">
<meta name="apple-mobile-web-app-title" content="Data Disc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF3;--panel:#FFFFFF;--panel2:#F2F5F9;--line:#C6D2E0;--text:#13213A;--muted:#56677F;
  --bad:#C0392B;--ok:#1E8A4C;--warn:#B7791F;
  --T:#2F7BCB;--Z:#8E44C2;--P:#C9951A;--acc:var(--T);--accInk:#fff;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1A2B;--panel:#162740;--panel2:#1C3150;--line:#2B4468;--text:#E3EBF5;--muted:#8DA2BE;--T:#4A95E6;--Z:#AE6BE0;--P:#E3B23C;--bad:#F07164;--ok:#48C27E;--warn:#E8B04C}
}
:root[data-theme="dark"]{--bg:#0E1A2B;--panel:#162740;--panel2:#1C3150;--line:#2B4468;--text:#E3EBF5;--muted:#8DA2BE;--T:#4A95E6;--Z:#AE6BE0;--P:#E3B23C;--bad:#F07164;--ok:#48C27E;--warn:#E8B04C}
body[data-race="T"]{--acc:var(--T);--accInk:#fff}
body[data-race="Z"]{--acc:var(--Z);--accInk:#fff}
body[data-race="P"]{--acc:var(--P);--accInk:#1B1404}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--acc);padding:10px 14px 8px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.15rem;flex:1;display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
header.top .brand{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
header.top #title{overflow:hidden;text-overflow:ellipsis}
header.top .race-mark{width:14px;height:22px;background:var(--acc);clip-path:polygon(0 0,100% 18%,100% 82%,0 100%)}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;font-family:var(--display);font-weight:600;font-size:.9rem;color:var(--muted);position:relative}
nav.tabs button[aria-current="true"]{color:var(--text)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--acc)}
section.view{display:none}section.view.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.panel h2{font-size:1.02rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
select,input[type=text],input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-height:42px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:9px 4px;font-family:var(--display);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accInk)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:9px 13px;min-height:42px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.9rem}
.btn:disabled{opacity:.45}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px;font-weight:600;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* resource bar */
.resbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:4;background:var(--bg);padding:6px 0 8px;margin:-4px 0 8px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.meter .n{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.1}
.meter .n span{font-size:.9rem;color:var(--muted);font-weight:600}
.meter .k{font-size:.8rem;color:var(--muted)}
.meter .bar{height:4px;background:var(--panel2);border-radius:2px;margin-top:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--acc)}
.meter.over .n{color:var(--bad)}.meter.over .bar i{background:var(--bad)}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.slot{font-size:.85rem;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 8px;font-weight:600}
.slot b{font-family:var(--display)}
.slot.over{border-color:var(--bad);color:var(--bad)}
.slot.full{border-color:var(--acc)}
/* items */
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.item .hd{display:flex;gap:8px;align-items:center}
.item .meta{font-size:.85rem;color:var(--muted)}
.cost{font-family:var(--display);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:4px;color:var(--muted)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.step button{border:0;background:var(--panel2);width:36px;height:34px;font-size:1.1rem;font-weight:700}
.step output{min-width:30px;text-align:center;font-family:var(--display);font-weight:700}
.ups{margin-top:8px;display:grid;gap:4px}
.ups label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;padding:4px 0}
.ups input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.issues{list-style:none;padding:0;margin:0}
.issues li{padding:6px 0 6px 18px;position:relative;font-size:.93rem}
.issues li::before{content:"";position:absolute;left:2px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.issues li.ok::before{background:var(--ok)}
.picker{display:grid;gap:6px}
.pick{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);text-align:left;width:100%}
.pick[disabled]{opacity:.5}
.pick .cost{font-size:.95rem}
details>summary{cursor:pointer;font-weight:600;list-style:none;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ ";color:var(--acc);font-family:var(--display)}
details[open]>summary::before{content:"– "}
/* play */
.bigrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.stat .n{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.05}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat.hl{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.phases div{text-align:center;font-family:var(--display);font-weight:600;font-size:.82rem;padding:7px 2px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.phases div.on{background:var(--acc);color:var(--accInk)}
.vp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vp .box{background:var(--panel2);border-radius:6px;padding:8px;text-align:center}
.vp .n{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1}
.vp .row{justify-content:center;margin-top:6px}
.banner{border-left:4px solid var(--warn);background:var(--panel2);padding:8px 10px;border-radius:4px;font-size:.93rem;margin-top:8px}
.banner.good{border-color:var(--ok)}
.cardchip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--panel2)}
.cardchip.ex{opacity:.55;border-style:dashed}
.cardchip .rs{font-family:var(--display);font-weight:700;font-size:.9rem}
.urow{padding:9px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .hd{display:flex;align-items:center;gap:8px}
.urow .ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sup{font-family:var(--display);font-weight:700;background:var(--panel2);border-radius:4px;padding:2px 7px;font-size:.9rem}
.done{text-decoration:line-through;color:var(--muted)}
.grp{font-family:var(--display);font-weight:600;font-size:.9rem;color:var(--muted);margin:10px 0 2px}
.ref{font-size:.92rem}
.ref ul{margin:4px 0;padding-left:18px}
/* modal */
dialog{border:0;padding:0;width:min(680px,100%);max-height:90vh;border-radius:10px 10px 0 0;margin:auto auto 0;background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(5,10,20,.6)}
dialog .mh{position:sticky;top:0;background:var(--panel);border-bottom:3px solid var(--acc);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:1}
dialog .mh h3{flex:1;font-size:1.2rem}
dialog .mb{padding:12px 14px 24px;overflow:auto}
.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0 10px}
.sgrid div{background:var(--panel2);border-radius:4px;text-align:center;padding:5px 2px}
.sgrid b{display:block;font-family:var(--display);font-size:1.15rem}
.sgrid small{font-size:.68rem;color:var(--muted)}
/* glossary */
.gl{display:inline;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-align:inherit;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--acc);text-decoration-thickness:1.5px;text-underline-offset:2px}
.gl:hover,.gl:focus-visible{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:600}
.chips .chip.ex{opacity:.55;text-decoration:line-through}
.av{border-radius:50%;object-fit:cover;flex:none;vertical-align:middle}
.av.ph{display:inline-grid;place-items:center;background:var(--acc);color:var(--accInk);font-weight:700;font-size:.8rem}
#acctBtn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;min-height:34px}
#acctBtn[hidden]{display:none}
#acctBtn .av{width:22px;height:22px}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
a.btn.pri{color:var(--accInk)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;margin-right:10px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.code{font-family:ui-monospace,Consolas,monospace;letter-spacing:.15em}
.rtext{white-space:pre-wrap;font:13px/1.4 var(--body);background:var(--panel2);padding:8px 10px;border-radius:6px;max-height:40vh;overflow:auto}
textarea{width:100%;font:14px/1.4 var(--body);color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px}
#sCode{text-transform:uppercase;letter-spacing:.15em;font-family:ui-monospace,Consolas,monospace}
.urow.opp .sup{margin-left:6px}
.chips button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
input[type=search]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-height:42px}
.gitem{padding:10px 0;border-top:1px solid var(--line)}
.gitem:first-child{border-top:0}
.gitem h3{font-size:1.02rem}
.gitem h3 small,.gcat{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px}
.gdef{margin:4px 0;font-size:.95rem}
.gletter{font-family:var(--display);font-weight:700;color:var(--acc);margin:14px 0 0;font-size:.95rem}
#gloss{max-height:75vh}
#gloss .mh h3{font-size:1.1rem}
.wt{overflow-x:auto;margin:4px 0 10px}
.wt table{border-collapse:collapse;font-size:.85rem;min-width:520px;width:100%}
.wt th,.wt td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.wt th{color:var(--muted);font-weight:600}
.wt td.kw{white-space:normal;min-width:150px}
.ab{margin:6px 0 8px;font-size:.93rem}
.ab b{font-family:var(--display);font-weight:600}
.kind{font-size:.75rem;font-weight:700;border-radius:3px;padding:0 5px;margin:0 4px;vertical-align:1px;background:var(--panel2);border:1px solid var(--line)}
.phh{font-family:var(--display);font-weight:600;color:var(--acc);margin-top:10px;font-size:.95rem}
.note{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body data-race="T">
<header class="top"><div class="race-mark" aria-hidden="true"></div><h1><span class="brand">SCTMG Data Disc</span><span id="title">Army builder</span></h1><button class="btn sm" id="acctBtn" hidden>Sign in</button><button class="btn sm" id="themeBtn" aria-label="Toggle light or dark theme">◐</button></header>
<main>
  <section class="view on" id="v-build"></section>
  <section class="view" id="v-setup"></section>
  <section class="view" id="v-play"></section>
  <section class="view" id="v-cards"></section>
  <section class="view" id="v-gloss"></section>
</main>
<nav class="tabs" aria-label="Sections">
  <button data-v="build" aria-current="true">Build</button>
  <button data-v="setup">Setup</button>
  <button data-v="play">Play</button>
  <button data-v="cards">Cards</button>
  <button data-v="gloss">Glossary</button>
</nav>
<dialog id="modal"><div class="mh"><h3 id="mTitle"></h3><button class="btn sm" id="mClose">Close</button></div><div class="mb" id="mBody"></div></dialog>
<dialog id="gloss" aria-labelledby="gTitle"><div class="mh"><button class="btn sm" id="gBack" hidden aria-label="Back to the previous term">‹</button><h3 id="gTitle"></h3><button class="btn sm" id="gClose">Close</button></div><div class="mb" id="gBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== DATA ===================== */
const W=(ph,n,rng,t,roa,hit,su,sd,dmg,kw)=>({ph,n,rng,t,roa,hit,su,sd,dmg,kw:kw||"-"});
const A=(ph,n,k,tx)=>({ph,n,k,tx});
const DEV=x=>A("Assault","Devastating Charge","Passive",`Immediately after this Unit completes a successful Charge, resolve the IMPACT (${x}) effect.`);
const STRUCT=A("Any","Structure","Passive","This Unit cannot be Activated in any Phase and cannot perform actions. Its Current Supply Value is treated as 0, and it can never Control or Contest Mission Markers, ignoring the standard Zero Supply Exception. This Unit cannot be a target of an ability, unless stated otherwise.");
const CMDR=A("Any","Commander","Passive","Treat this Unit's Supply characteristic as increased by 1 for Controlling and Contesting Mission Markers, completing objectives, and resolving Disengage checks.");
const SQUAD=A("Any","Squadron","Passive","This Unit's Horizontal Coherency is 4″.");
const RESTO=k=>A("Any","Restoration","Reaction · 1 "+k,"Use when a Friendly Unit Within 4″ receives a DEBUFF. Remove all DEBUFFS from it.");
const CHARGE2D6=(n,k)=>A("Assault",n,"Active · 1 "+k,"When determining Charge Distance for this Unit, roll 2D6 instead of D6 and use the higher result to add to the Unit's Speed characteristic.");
const BURROW_AMB="When this Unit is nominated to deploy from the Reserves, it may resolve the PLACE (18) effect from the controlling player's Entry Edge. No model may be set Within 10″ of any Enemy model. This Unit's Activation ends.";
const RAPTOR_STRAIN=A("Any","Raptor Strain","Passive","This Unit can move through IMPASSABLE TERRAIN of Size 4 or less and change elevation without using ACCESS POINTS.");
const ADRENAL_OVER=A("Assault","Adrenal Overload","Active · 1 BM","This Unit gains a +1 Modifier to all IMPACT Hit Rolls.");
const BURROW=(eng)=>A("Any","Burrow","Active · 2 BM",`If this Unit is ${eng?"not Engaged":"Unengaged"}, it gains or loses the Burrowed Status.`);
const REGEN=A("Assault","Regeneration","Passive","When this Unit becomes Activated, if it has the Burrowed Status, resolve the HEAL (2) effect.");
const NIMBLE=A("Any","Nimble","Passive","This Unit is always eligible to use Evade Rolls against Attacks or Special Abilities.");
const TIMED_LIFE=A("Any","Timed Life","Passive","Remove this Unit at the End of the Round.");
const NOVA_PREP=A("Any","Battle Preparation","Passive","During Army Building, your army cannot include both the Nova Assault Mode Unit and the Nova Stealth Mode Unit.");
const GHOST_VISOR=A("Any","Ghost Visor","Passive","While Enemy Units are Within 6″ of this Unit, they lose the HIDDEN Status.");
const SUPER_STIM=A("Movement","Super Stimpack","Active · 1 CP","This Unit gains BUFF Speed (2). Additionally, all its Weapons gain PRECISION (2).");
const HOLO_DECOY=A("Movement","Holo Decoy","Active · 1 CP","Resolve the SUMMON (Holo Decoy) effect. Then, Holo Decoy may immediately perform a Move action.");
const INDOM=A("Assault","Indomitable","Passive","While Engaged, this Unit may target and be targeted by Unengaged Enemy Units. In both cases, the defending Unit gains an Evade Roll against those attacks.");
const FEEDBACK=A("Movement","Feedback","Active · 1 PE","Target one Enemy Mechanical or Psionic Unit Within 8″. Until the End of the Round, after that Unit resolves an Active or Reaction Special Ability (excluding abilities granted by a Tactical Card or Faction Card), it suffers NON-LETHAL DAMAGE (3).");
const STIM=(w,p)=>A("Movement","Stimpack","Active · 1 CP",`This Unit suffers NON-LETHAL DAMAGE (2). This Unit gains BUFF Speed (3). Additionally, its ${w} and all Close Combat Weapons gain PRECISION (${p}).`);
const SPREAD_INF="Target an Enemy Unit Within 8″. The targeted Unit gains the INFESTATION Status. For the purposes of resolving Special Abilities, this effect is treated as a DEBUFF.";
const LIVE_SWARM=A("Any","Live for the Swarm!","Passive","When this Unit attacks an Enemy Unit with the INFESTATION Status or a Unit Within 6″ of any Source of Creep or Creep Tumor, its Infested C-14 Rifle and all Close Combat Attacks gain PRECISION (2).");
const DETONATION=x=>A("Any","Detonation","Reaction · 1 BM",`Immediately before any models in this Unit are Destroyed, Enemy Units Within 2″ suffer HITS 1 (${x}) for each model in this Unit that will be Destroyed.`);
const PLAGUED=A("Assault","Plagued Munitions","Passive","Immediately after an attack with the Infested C-14 Rifle, if the attacked Unit suffered Damage, it also suffers NON-LETHAL DAMAGE (1).");
const ROACH_UPS=(glial)=>[
 {n:"Tunneling Claws",c:[10],ph:"Any",k:"Passive",tx:"While this Unit has the Burrowed Status, it may perform the Move and Run actions without losing that Status. It may also move through other Units' bases."},
 {n:"Glial Reconstitution",c:[10],ph:"Movement",k:"Active · 1 "+glial,tx:"This Unit gains BUFF SPEED (1), or BUFF SPEED (2) if the Unit is ON CREEP."+(glial==="CP"?" (Printed as 1 CP on this card.)":"")},
 {n:"Burrow Ambush",c:[20],ph:"Movement",k:"Passive",tx:BURROW_AMB},
 {n:"Hydriodic Bile",c:[10],ph:"Assault",k:"Passive",tx:"This Unit's Acid Saliva weapon gains Surge Type: Light, and S Dice: D3+1."}];
const LING_UPS=[
 {n:"Burrow Ambush",c:[20,30],ph:"Movement",k:"Passive",tx:BURROW_AMB},
 {n:"Shredding Claws",c:[10,10],ph:"Combat",rep:"Claws",w:W("Combat","Shredding Claws","E","Ground",2,"4+","Light, Armoured","D3",1)},
 {n:"Adrenal Glands",c:[20,20],ph:"Combat",k:"Passive",tx:"This Unit's Claws and Shredding Claws weapons gain PRECISION (2)."}];

// Wave 4 base sizes: Archon's database prints none, so the few printed on photographed cards come from there.
const W4PHOTO="v1.10.26 card photos from r/StarCraftTMG (2026-11-25); may be pre-release";
const UNITS=[
/* ---------- TERRAN ---------- */
{id:"marine",n:"Marine",r:"T",tags:["Terran"],slot:"Core",role:"Damage Dealer",base:"32mm",st:["-","4/7","5+","5+",2,2],ct:"Biological, Light, Ground",
 prof:[[1,3,0],[4,6,1],[7,9,2]],comps:[[6,170,1],[9,220,2]],

let st=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)return Object.assign({},S0,s)}catch(e){}return JSON.parse(JSON.stringify(S0))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function newBuild(race){return {id:"r"+Date.now(),name:"New army",scale:"std",goMin:2500,race:race||"T",faction:"",tac:{},tacSlots:{},units:[],missions:[],deps:[]}}
if(!st.build)st.build=newBuild("T");
const U=id=>UNITS.find(u=>u.id===id), T=id=>TAC.find(t=>t.id===id), M=id=>MISSIONS.find(m=>m.id===id), D=id=>DEPLOYS.find(d=>d.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Saved data can outlive the cards it points at: a later wave may rename or
   remove an ID. Clean it on load so one stale ID can't crash a view, and tell
   the player what was dropped. When renaming an ID, add {oldId:"newId"} to
   RENAMED so existing rosters follow the rename instead of losing the entry. */
const RENAMED={};
const fixId=id=>RENAMED[id]||id;
const arr=v=>Array.isArray(v)?v:[];
function cleanBuild(b,notes,where){
  if(!RACES[b.race])b.race="T";
  if(!SCALES[b.scale])b.scale="std";
  b.tac=b.tac&&typeof b.tac==="object"?b.tac:{};b.tacSlots=b.tacSlots&&typeof b.tacSlots==="object"?b.tacSlots:{};
  if(b.faction){b.faction=fixId(b.faction);const f=T(b.faction);if(!f||f.type!=="Faction"||f.r!==b.race){notes.push(`${where}: faction card "${b.faction}"`);b.faction=""}}
  const tac={};Object.entries(b.tac).forEach(([id,q])=>{const t=T(fixId(id));if(t&&t.type!=="Faction"&&t.r===b.race){if(+q>0)tac[t.id]=(tac[t.id]||0)+(+q)}else notes.push(`${where}: card "${id}"`)});b.tac=tac;
  b.units=arr(b.units).filter(bu=>{if(!bu||typeof bu!=="object")return false;const u=U(fixId(bu.id));
    if(!u||u.sum||u.r!==b.race){notes.push(`${where}: unit "${bu.id}"`);return false}
    bu.id=u.id;if(!(Number.isInteger(bu.ci)&&bu.ci>=0&&bu.ci<u.comps.length))bu.ci=0;
    bu.ups=arr(bu.ups).filter(n=>{if(u.up.some(x=>x.n===n))return true;notes.push(`${where}: upgrade "${n}" on ${u.n}`);return false});return true});
  b.missions=arr(b.missions).map(fixId).filter(id=>M(id));b.deps=arr(b.deps).map(fixId).filter(id=>D(id));
  if(typeof b.name!=="string")b.name="Army";
  return b;
}
function cleanState(s){
  const notes=[];
  if(!s.build||typeof s.build!=="object")s.build=newBuild("T");
  cleanBuild(s.build,notes,`Current roster "${s.build.name}"`);
  s.rosters=arr(s.rosters).filter(r=>r&&typeof r==="object").map(r=>cleanBuild(r,notes,`Saved roster "${r.name}"`));
  s.setup=Object.assign({},S0.setup,s.setup);
  s.tomb=s.tomb&&typeof s.tomb==="object"&&!Array.isArray(s.tomb)?Object.assign({},s.tomb):{};
  if(s.setup.mission&&!M(s.setup.mission))s.setup.mission="";
  if(s.setup.deploy&&!D(s.setup.deploy))s.setup.deploy="";
  if(s.setup.rosterId!=="current"&&!s.rosters.some(r=>r.id===s.setup.rosterId))s.setup.rosterId="current";
  const g=s.game;
  if(g&&(typeof g!=="object"||!M(fixId(g.mission))||!g.roster)){notes.push(`Game in progress: its mission no longer exists, so the game was cleared`);s.game=null}
  else if(g){
    g.mission=fixId(g.mission);if(g.deploy&&!D(fixId(g.deploy)))g.deploy="";else if(g.deploy)g.deploy=fixId(g.deploy);
    cleanBuild(g.roster,[],"");
    g.units=arr(g.units).filter(u=>{const ud=u&&U(fixId(u.id));if(!ud){notes.push(`Game in progress: unit "${u&&u.id}"`);return false}u.id=ud.id;u.ups=arr(u.ups);return true});
    g.cards=arr(g.cards).filter(c=>{const t=c&&T(fixId(c.id));if(!t){notes.push(`Game in progress: card "${c&&c.id}"`);return false}c.id=t.id;return true});
    if(!Array.isArray(g.vp)||g.vp.length!==2)g.vp=[0,0];
  }
  return notes;
}

/* ===================== CALCS ===================== */
function limits(b){const min=b.scale==="go"?(+b.goMin||2001):SCALES[b.scale].min;return {min,gas:Math.floor(min/10)}}
function unitCost(bu){const u=U(bu.id);let c=u.comps[bu.ci][1];(bu.ups||[]).forEach(n=>{const up=u.up.find(x=>x.n===n);if(up)c+=up.c[Math.min(bu.ci,up.c.length-1)]});return c}
function tacSlots(b,id){const t=T(id);return t.unk?(b.tacSlots[id]||{}):t.slots}
function totals(b){
  let min=0,gas=0;const avail={},used={};SLOT_TYPES.forEach(s=>{avail[s]=0;used[s]=0});
  if(b.faction){const f=T(b.faction);SLOT_TYPES.forEach(s=>avail[s]+=f.slots[s]||0)}
  Object.entries(b.tac).forEach(([id,q])=>{const t=T(id);if(!t||!q)return;gas+=t.gas*q;const sl=tacSlots(b,id);SLOT_TYPES.forEach(s=>avail[s]+=(sl[s]||0)*q)});
  b.units.forEach(bu=>{const u=U(bu.id);min+=unitCost(bu);const sl=u.unk?(bu.slot||u.slot):u.slot;used[sl]=(used[sl]||0)+u.comps[bu.ci][2]});
  return {min,gas,avail,used}
}
function eligible(b,tags){if(!b.faction)return true;const ft=T(b.faction).tags;return tags.every(t=>ft.includes(t))}
function issues(b){
  const out=[],L=limits(b),t=totals(b);
  if(!b.faction)out.push("Pick a Faction Card.");
  if(t.min>L.min)out.push(`Minerals over by ${t.min-L.min}.`);
  if(t.gas>L.gas)out.push(`Vespene Gas over by ${t.gas-L.gas}.`);
  SLOT_TYPES.forEach(s=>{if(t.used[s]>t.avail[s])out.push(`${s} slots: using ${t.used[s]} of ${t.avail[s]}. Add a Tactical Card that gives ${s} slots.`)});
  b.units.forEach(bu=>{const u=U(bu.id);if(!eligible(b,u.tags))out.push(`${u.n} needs the ${u.tags.filter(x=>!T(b.faction).tags.includes(x)).join(", ")} tag on your Faction Card.`)});
  Object.keys(b.tac).forEach(id=>{const tc=T(id);if(b.tac[id]&&!eligible(b,tc.tags))out.push(`${tc.n} isn't allowed with this Faction Card.`)});
  const cnt={};b.units.forEach(bu=>{cnt[bu.id]=(cnt[bu.id]||0)+1});Object.entries(cnt).forEach(([id,n])=>{if(U(id).uq&&n>1)out.push(`${U(id).n} is Unique: only one allowed.`)});
  b.units.forEach(bu=>(U(bu.id).excl||[]).forEach(x=>{if(bu.id<x&&cnt[x])out.push(`${U(bu.id).n} and ${U(x).n} can't be in the same army.`)}));
  // Zerg factions take exactly one Creep Card, or whatever card type the faction names in `need` (Stukov's Forces: Virus).
  if(b.faction&&b.race==="Z"){const f=T(b.faction),need=f.need||"Creep",count=ty=>Object.keys(b.tac).filter(id=>b.tac[id]&&T(id).type===ty).length;
    if(count(need)!==1)out.push(need==="Creep"?"Zerg armies must take exactly one Creep Card.":`${f.n} must take exactly one ${need} Card.`);
    ["Creep","Virus"].filter(ty=>ty!==need&&count(ty)).forEach(ty=>out.push(`${f.n} takes a ${need} Card, not a ${ty} Card.`))}
  b.units.forEach(bu=>{const u=U(bu.id);const reps={};(bu.ups||[]).forEach(n=>{const up=u.up.find(x=>x.n===n);if(up&&up.rep&&!up.spec){if(reps[up.rep])out.push(`${u.n}: ${reps[up.rep]} and ${n} both replace ${up.rep}; pick one.`);reps[up.rep]=n}})});
  if(b.units.some(bu=>U(bu.id).unk))out.push("Some units have no card in your PDFs; check their Army Slot and tags against the real card.");
  return out;
}
function curSupply(gu){const u=U(gu.id);if(gu.models<=0)return 0;if(!u.prof)return gu.startSup;const p=u.prof.find(p=>gu.models>=p[0]&&gu.models<=p[1]);return p?p[2]:gu.startSup}
function poolSupply(gu){ if(gu.ups&&gu.ups.includes("Advanced Medic Facilities"))return 0; return curSupply(gu)}

/* ===================== GLOSSARY LINKS ===================== */
/* Turn glossary terms in already-escaped HTML into tappable buttons. Matching
   is case-sensitive (cards capitalise rules terms), longest form first, on
   whole words only, and each term is linked once per call so a paragraph
   isn't a sea of underlines. Text inside tags or existing buttons is skipped. */
const glb=(id,label)=>`<button type="button" class="gl" data-gl="${id}">${label}</button>`;
function glMatcher(extra){
  const forms=[];GLOSSARY.forEach(g=>g.f.forEach(f=>forms.push([f,g.id])));(extra||[]).forEach(x=>forms.push(x));
  forms.sort((a,b)=>b[0].length-a[0].length);
  const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return {map:new Map(forms),re:new RegExp("(^|[^A-Za-z0-9])("+forms.map(x=>reEsc(x[0])).join("|")+")(?![A-Za-z0-9])","g")};
}
const GL_TEXT=glMatcher(), GL_KIND=glMatcher([["Active","active"],["Passive","passive"]]);
function linkTerms(html,opt){
  opt=opt||{};const M=opt.kind?GL_KIND:GL_TEXT,seen=new Set(opt.skip?[opt.skip]:[]);let inBtn=0;
  return String(html).split(/(<[^>]*>)/).map(part=>{
    if(part[0]==="<"){if(/^<button\b/i.test(part))inBtn++;else if(/^<\/button/i.test(part))inBtn--;return part}
    if(inBtn)return part;
    return part.replace(M.re,(m,pre,term)=>{const id=M.map.get(term);if(seen.has(id))return m;seen.add(id);return pre+glb(id,term)});
  }).join("");
}
const rt=s=>linkTerms(esc(s)); // rules text: escape, then link terms

/* ===================== ROSTER FILES, TEXT AND SYNC (pure) =====================
   Export/import a "Data Disc" file, rebuild a roster from its copied text, and
   merge saved rosters with the copy stored online. No DOM here, so
   tests/logic.mjs can check all of it in Node. */
const DISC_FORMAT="sctmg-data-disc";
const newRosterId=()=>"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// "Save as new": a name no saved roster already uses ("Raiders" -> "Raiders (2)" -> "Raiders (3)").
function freeRosterName(name,rosters){name=String(name||"").trim()||"New army";const taken=new Set((rosters||[]).map(r=>r.name));if(!taken.has(name))return name;
  const base=name.replace(/ \(\d+\)$/,"");let n=2;while(taken.has(`${base} (${n})`))n++;return `${base} (${n})`}
// A deep copy of the build with its own id, so saving it never overwrites the original.
function copyAsNew(b,name){const c=JSON.parse(JSON.stringify(b));c.id=newRosterId();c.name=String(name||"").trim().slice(0,80)||"New army";c.updated=Date.now();return c}
function rosterText(b){const t=totals(b),L=limits(b);let s=`${b.name}\n${RACES[b.race]} — ${b.faction?T(b.faction).n:"(no faction)"} — ${SCALES[b.scale].n}\nMinerals ${t.min}/${L.min} · Vespene ${t.gas}/${L.gas} · Supply ${b.units.reduce((a,bu)=>a+U(bu.id).comps[bu.ci][2],0)}\n\nUNITS\n`;
  b.units.forEach(bu=>{const u=U(bu.id);s+=`- ${u.n} ×${u.comps[bu.ci][0]} (Supply ${u.comps[bu.ci][2]}, ${unitCost(bu)} min)${bu.ups&&bu.ups.length?" — "+bu.ups.join(", "):""}\n`});
  s+=`\nTACTICAL CARDS\n`;Object.entries(b.tac).forEach(([id,q])=>{if(q)s+=`- ${T(id).n}${q>1?" ×"+q:""} (${T(id).gas*q} gas)\n`});
  s+=`\nMISSIONS: ${b.missions.map(id=>M(id).n).join(", ")||"—"}\nDEPLOYMENTS: ${b.deps.map(id=>D(id).n).join(", ")||"—"}\n\nBuilt with SCTMG Data Disc\n`;return s}

// With `only`, the file holds just that roster; without it, every saved roster plus the current build.
function exportData(s,only){
  const d={format:DISC_FORMAT,kind:"rosters",version:1,exported:new Date().toISOString()};
  if(only)d.rosters=[JSON.parse(JSON.stringify(only))];
  else{d.rosters=JSON.parse(JSON.stringify(s.rosters));d.current=JSON.parse(JSON.stringify(s.build))}
  return d;
}
// Accepts a Data Disc file, a bare roster, or an array of rosters. Returns the
// rosters to add (already cleaned, with fresh IDs where they'd clash), the
// ones identical to a saved roster (`dupes`, so the player can still import
// them as copies) and notes about anything dropped. Never throws on bad input.
function importData(data,existing){
  const notes=[],out=[];let list=[];
  if(Array.isArray(data))list=data;
  else if(data&&typeof data==="object"){
    if(Array.isArray(data.rosters))list=data.rosters.slice();
    else if(data.race&&Array.isArray(data.units))list=[data];
    if(data.current&&typeof data.current==="object"&&Array.isArray(data.current.units)&&data.current.units.length&&!list.some(r=>r&&r.id===data.current.id))list.push(data.current);
  }
  if(!list.length)return {rosters:[],notes:["That file doesn't contain any SCTMG Data Disc rosters."],skipped:0,dupes:[]};
  const strip=r=>{const c=Object.assign({},r);delete c.updated;c.units=arr(c.units).map(u=>{const x=Object.assign({},u);delete x.uid;delete x.slot;return x});return JSON.stringify(c)}; // uid is per-device, slot is filled in on import
  const have=new Map(arr(existing).map(r=>[r.id,r])),dupes=[];
  list.forEach(raw=>{
    if(!raw||typeof raw!=="object"||!Array.isArray(raw.units))return;
    const r=cleanBuild(JSON.parse(JSON.stringify(raw)),notes,`Imported roster "${typeof raw.name==="string"?raw.name:"Army"}"`);
    r.name=r.name.slice(0,80)||"Imported army";if(!SCALES[r.scale])r.scale="std";if(typeof r.goMin!=="number")r.goMin=2500;
    r.units.forEach(bu=>{bu.uid=++uidc;if(!bu.slot)bu.slot=U(bu.id).slot});
    const same=typeof r.id==="string"&&have.get(r.id);
    if(same&&strip(same)===strip(r)){dupes.push(r);return}
    if(typeof r.id!=="string"||!/^[A-Za-z0-9_-]{1,40}$/.test(r.id)||have.has(r.id)||out.some(x=>x.id===r.id))r.id=newRosterId();
    r.updated=Date.now();out.push(r);
  });
  return {rosters:out,notes,skipped:dupes.length,dupes};
}
// Turn rosters that are already saved into new ones: fresh IDs, and names
// that don't collide with `rosters` or with each other.
function asNewCopies(list,rosters){const taken=arr(rosters).slice();
  return arr(list).map(r=>{const c=copyAsNew(r,freeRosterName(r.name,taken));taken.push(c);return c})}

// Rebuild a roster from the text that "Copy as text" makes. Lenient: bullet
// style, case and the × sign don't matter, and anything it can't match is
// reported instead of guessed.
function parseRosterText(txt){
  const notes=[],norm=s=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9']+/g," ").trim();
  const lines=String(txt||"").split(/\r?\n/).map(l=>l.trim());
  const raceLine=lines.find(l=>/^(Terran|Zerg|Protoss)\b/i.test(l));
  if(!raceLine)return {build:null,notes:["Couldn't find the race line (it starts with Terran, Zerg or Protoss)."]};
  const race=Object.keys(RACES).find(k=>RACES[k].toLowerCase()===raceLine.match(/^(\w+)/)[1].toLowerCase());
  const b=newBuild(race);b.id=newRosterId();
  const nameLine=lines.find(l=>l);b.name=(nameLine&&nameLine!==raceLine?nameLine:"Imported army").slice(0,80);
  const parts=raceLine.split(/\s+[—–-]\s+/);
  const scale=Object.keys(SCALES).find(k=>parts.some(p=>norm(p)===norm(SCALES[k].n)));if(scale)b.scale=scale;
  const minL=lines.find(l=>/^Minerals\s/i.test(l));const mm=minL&&minL.match(/Minerals\s+\d+\s*\/\s*(\d+)/i);if(b.scale==="go"&&mm)b.goMin=Math.max(2001,+mm[1]);
  const facName=parts[1];
  if(facName&&!/no faction/i.test(facName)){const f=TAC.find(t=>t.r===race&&t.type==="Faction"&&norm(t.n)===norm(facName));if(f)b.faction=f.id;else notes.push(`Faction card not found: ${facName}`)}
  let sec="";
  const item=l=>{const m=l.replace(/^[-•*]\s*/,"").match(/^(.*?)(?:\s*[×x]\s*(\d+))?(?:\s*\(([^)]*)\))?(?:\s+[—–]\s+(.*))?$/i);return m&&{n:m[1].trim(),q:m[2]?+m[2]:null,rest:m[4]||""}};
  lines.forEach(l=>{
    if(!l)return;
    if(/^units$/i.test(l)){sec="u";return}
    if(/^tactical cards$/i.test(l)){sec="t";return}
    let mt=l.match(/^(missions|deployments)\s*:\s*(.*)$/i);
    if(mt){sec="";const isM=/^m/i.test(mt[1]);mt[2].split(/\s*,\s*/).filter(x=>x&&x!=="—"&&x!=="-").forEach(n=>{const hit=(isM?MISSIONS:DEPLOYS).find(x=>norm(x.n)===norm(n));if(hit)(isM?b.missions:b.deps).push(hit.id);else notes.push(`${isM?"Mission":"Deployment"} not found: ${n}`)});return}
    if(!/^[-•*]/.test(l)||!sec)return;
    const it=item(l);if(!it||!it.n)return;
    if(sec==="u"){
      const u=UNITS.find(x=>x.r===race&&!x.sum&&norm(x.n)===norm(it.n));
      if(!u){notes.push(`Unit not found: ${it.n}`);return}
      let ci=it.q?u.comps.findIndex(c=>c[0]===it.q):0;if(ci<0){notes.push(`${u.n}: no ${it.q}-model option, used ${u.comps[0][0]}`);ci=0}
      const ups=[];if(it.rest)it.rest.split(/\s*,\s*/).forEach(n=>{const up=u.up.find(x=>norm(x.n)===norm(n));if(up){if(!ups.includes(up.n))ups.push(up.n)}else notes.push(`${u.n}: upgrade not found: ${n}`)});
      b.units.push({uid:++uidc,id:u.id,ci,ups,slot:u.slot});
    }else{
      const t=TAC.find(x=>x.r===race&&x.type!=="Faction"&&norm(x.n)===norm(it.n));
      if(!t){notes.push(`Card not found: ${it.n}`);return}
      b.tac[t.id]=Math.min(t.uq?1:9,(b.tac[t.id]||0)+(it.q||1));
    }
  });
  b.missions=b.missions.slice(0,2);b.deps=b.deps.slice(0,2);
  b.updated=Date.now();
  return {build:b,notes};
}

// Merge local saved rosters with the online copy. Newest `updated` wins per
// roster; deletes travel as tombstones. Returns the merged list plus what to
// upload (push) and which deletes to send (drop).
function mergeRosters(local,tombs,remote){
  const rem=new Map(arr(remote).map(r=>[r.id,r]));tombs=tombs||{};
  const rosters=[],push=[],drop=[];let changed=false;
  arr(local).forEach(r=>{
    const x=rem.get(r.id),lu=r.updated||0;
    if(!x){push.push(r);rosters.push(r);return}
    if(x.deleted){if(lu>x.updated){push.push(r);rosters.push(r)}else changed=true;return}
    if(lu>x.updated){push.push(r);rosters.push(r)}
    else if(x.updated>lu){rosters.push(x.data);changed=true}
    else rosters.push(r);
  });
  rem.forEach((x,id)=>{
    if(x.deleted||arr(local).some(r=>r.id===id))return;
    if(tombs[id]&&tombs[id]>=x.updated)return; // deleted here after its last edit: sent as a drop below
    rosters.push(x.data);changed=true;
  });
  Object.keys(tombs).forEach(id=>{const x=rem.get(id);if(!x||(!x.deleted&&x.updated<=tombs[id]))drop.push(id)});
  return {rosters,push,drop,changed};
}

/* ===================== ONLINE GAME STATE (pure) =====================
   An online game keeps the same local shape as a solo game (round, phase,
   units, cards, vp) plus g.online {code, side, v, seen, status} and g.opp, the
   opponent's side as the server last sent it. */
const otherSide=s=>s==="A"?"B":"A";
function gameSide(r){
  const cards=[];if(r.faction)cards.push({id:r.faction,ready:true});Object.entries(r.tac).forEach(([id,q])=>{for(let i=0;i<q;i++)cards.push({id,ready:true})});
  return {cards,units:r.units.map(bu=>{const u=U(bu.id);const c=u.comps[bu.ci];return {uid:++uidc,id:u.id,ups:bu.ups||[],models:c[0],max:c[0],startSup:c[2],status:"res",act:false,snap:0}})};
}
const stepIndex=(round,phase)=>round*4+phase;
// Turn a server response into the local game object.
function gameFromRemote(res){
  const s=res.state,me=s.sides[res.side],op=s.sides[otherSide(res.side)];
  return {online:{code:res.code,side:res.side,v:res.v,status:res.status,seen:stepIndex(s.round,s.phase),seenRound:s.round},
    roster:me.roster,mission:s.mission,deploy:s.deploy,scale:s.scale,round:s.round,phase:s.phase,over:s.over,
    vp:[me.vp||0,op?op.vp||0:0],units:arr(me.units),cards:arr(me.cards),opp:op||null,log:[]};
}
// Apply a newer server state to the local game. keepMine=true while my own
// side has local edits that haven't been uploaded yet. When the shared Round or
// Phase moved forward, this does my own side's bookkeeping (activations reset,
// cards refresh at a new Round) and returns true so the caller uploads it.
function applyRemoteState(g,res,keepMine){
  const s=res.state,me=s.sides[g.online.side],op=s.sides[otherSide(g.online.side)];
  g.online.v=res.v;g.online.status=res.status;
  g.mission=s.mission;g.deploy=s.deploy;g.scale=s.scale;g.round=s.round;g.phase=s.phase;g.over=s.over;
  g.vp=[me.vp||0,op?op.vp||0:0];g.opp=op||null;
  if(!keepMine){g.units=arr(me.units);g.cards=arr(me.cards)}
  const now=stepIndex(s.round,s.phase);let changed=false;
  if(now>g.online.seen){
    g.units.forEach(u=>u.act=false);changed=true;
    if(s.round>g.online.seenRound){g.cards.forEach(c=>c.ready=true);g.units.forEach(u=>{u.snap=u.status==="field"?curSupply(u):0})}
  }
  g.online.seen=now;g.online.seenRound=s.round;
  return changed;
}

function onBuildClick(e){
  const b=st.build,el=e.target.closest("button,input,select");if(!el)return;const ds=el.dataset;
  if(ds.race&&el.tagName==="BUTTON"){if(b.race!==ds.race){if(b.units.length||Object.keys(b.tac).length){if(!confirm("Switching race clears this roster's units and cards. Continue?"))return}Object.assign(b,{race:ds.race,faction:"",tac:{},tacSlots:{},units:[]})}}
  else if(ds.tac){showTac(ds.tac);return}
  else if(ds.unit){const bu=b.units[+ds.bi];showUnit(ds.unit,bu?bu.ups:null);return}
  else if(ds.tq){const id=ds.tq,d=+ds.d;const q=Math.max(0,(b.tac[id]||0)+d);if(T(id).uq&&q>1)return;if(q)b.tac[id]=q;else delete b.tac[id]}
  else if(ds.urm!==undefined){b.units.splice(+ds.urm,1)}
  else if(ds.uadd){const u=U(ds.uadd);b.units.push({uid:++uidc,id:u.id,ci:0,ups:[],slot:u.slot});toast(u.n+" added")}
  else if(el.id==="bExport"){openExport();return}
  else if(el.id==="bImport"){$("#bFile").click();return}
  else if(el.id==="bPaste"){openPaste();return}
  else if(ds.rshare){shareRoster(st.rosters.find(r=>r.id===ds.rshare));return}
  else if(el.id==="bSave"){b.updated=Date.now();const copy=JSON.parse(JSON.stringify(b));pushRoster(copy);const i=st.rosters.findIndex(r=>r.id===b.id);if(i>=0)st.rosters[i]=copy;else st.rosters.push(copy);toast("Roster saved")}
  else if(el.id==="bSaveAs"){const sug=freeRosterName(b.name,st.rosters),name=prompt("Save as a new roster named:",sug);if(name===null)return;
    const copy=copyAsNew(b,name.trim()||sug);st.rosters.push(JSON.parse(JSON.stringify(copy)));pushRoster(copy);st.build=copy;toast(`Saved as “${copy.name}”`)}
  else if(el.id==="bCopy"){const txt=rosterText(b);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Roster copied")).catch(()=>openModal("Roster text",`<pre style="white-space:pre-wrap;font:14px/1.4 var(--body)">${esc(txt)}</pre>`));return}
  else if(el.id==="bNew"){st.build=newBuild(b.race);toast("New roster started")}
  else if(ds.rload){st.build=JSON.parse(JSON.stringify(st.rosters.find(r=>r.id===ds.rload)));toast("Roster loaded")}
  else if(ds.rdel){if(!confirm("Delete this saved roster?"))return;st.rosters=st.rosters.filter(r=>r.id!==ds.rdel);st.tomb[ds.rdel]=Date.now();pushDelete(ds.rdel)}
  else return;
  save();renderBuild();
}
function onBuildChange(e){
  const b=st.build,el=e.target,ds=el.dataset;
  if(el.id==="bFile"){if(el.files[0])importFile(el.files[0]);el.value="";return}
  if(el.id==="bName"){b.name=el.value;save();return}

  else if(ds.uup!==undefined){const bu=b.units[+ds.uup];bu.ups=bu.ups||[];if(el.checked){if(!bu.ups.includes(el.value))bu.ups.push(el.value)}else bu.ups=bu.ups.filter(x=>x!==el.value)}
  else if(ds.ts){b.tacSlots[ds.ts]=b.tacSlots[ds.ts]||{};b.tacSlots[ds.ts][ds.s]=Math.max(0,+el.value||0)}
  else if(ds.mis){if(el.checked){if(b.missions.length>=2){el.checked=false;toast("Pick 2 Missions");return}b.missions.push(ds.mis)}else b.missions=b.missions.filter(x=>x!==ds.mis)}

  else return;
  save();renderBuild();
}

  ${dep?`<p class="ab">${esc(dep.d)}</p><p class="note">Check the printed card for exact Marker positions.</p>`:""}</div>`;
  h+=`<div class="panel"><button class="btn pri" id="sStart" ${(!mis||!r.units.length)?"disabled":""}>Start game</button>${st.game?` <button class="btn" data-go-play>Resume current game</button>`:""}${!mis?`<p class="note">Choose a Mission to start.</p>`:""}<p class="note">Starts a game tracked only on this device.</p></div>`;

$("#v-setup").addEventListener("change",e=>{const el=e.target,su=st.setup;

function startGame(){
  const r=JSON.parse(JSON.stringify(setupRoster()));const scale=r.scale==="sk"?"sk":"std";
  const cards=[];if(r.faction)cards.push({id:r.faction,ready:true});Object.entries(r.tac).forEach(([id,q])=>{for(let i=0;i<q;i++)cards.push({id,ready:true})});
  st.game={roster:r,mission:st.setup.mission,deploy:st.setup.deploy,scale,round:1,phase:0,vp:[0,0],over:false,
    units:r.units.map(bu=>{const u=U(bu.id);const c=u.comps[bu.ci];return {uid:++uidc,id:u.id,ups:bu.ups||[],models:c[0],max:c[0],startSup:c[2],status:"res",act:false,snap:0}}),cards,log:[]};
  save();
}

/* ===================== PLAY VIEW ===================== */
function pool(g){const v=M(g.mission)[g.scale];return g.round>=v.len?Infinity:v.sup+v.esc*(g.round-1)}
function renderPlay(){
  const g=st.game;const el=$("#v-play");
  if(!g){el.innerHTML=`<div class="panel"><h2>No game running</h2><p>Pick a roster and Mission on the Setup tab, then start a game.</p><button class="btn pri" data-go="setup">Go to Setup</button></div>`;return}
  setRace(g.roster.race);const mv=M(g.mission)[g.scale];const P=pool(g);
  const field=g.units.filter(u=>u.status==="field"),res=g.units.filter(u=>u.status==="res"),dead=g.units.filter(u=>u.status==="dead");
  const onField=field.reduce((a,u)=>a+poolSupply(u),0);const avail=P===Infinity?Infinity:P-onField;
  const lost=g.units.reduce((a,u)=>a+Math.max(0,(u.snap||0)-curSupply(u)),0);
  const lead=g.vp[0]-g.vp[1];
  const rsType=g.cards.find(c=>T(c.id).res)?T(g.cards.find(c=>T(c.id).res).id).res[0]:"";
  const ready=g.cards.filter(c=>c.ready&&T(c.id).res).reduce((a,c)=>a+T(c.id).res[1],0);
  let h=(g.online?onlineHeaderHTML(g):"")+`<div class="bigrow"><div class="stat"><div class="n">${g.round}<span style="font-size:1rem;color:var(--muted)">/${mv.len}</span></div><div class="k">Round</div></div>
  <div class="stat hl"><div class="n">${avail===Infinity?"∞":avail}</div><div class="k">Available Supply</div></div>
  <div class="stat"><div class="n">${P===Infinity?"∞":P}</div><div class="k">Supply Pool</div></div></div>`;
  h+=`<div class="panel"><h2>${esc(M(g.mission).n)} <small>${g.deploy?esc(D(g.deploy).n):""}</small></h2>
  <div class="phases">${PHASES.map((p,i)=>`<div class="${i===g.phase?"on":""}">${p.replace(" & Cleanup","")}</div>`).join("")}</div>
  <div class="ref">${linkTerms(PHASE_REF[g.phase])}</div>
  <div class="row" style="margin-top:8px"><button class="btn" id="pPrev" ${g.round===1&&g.phase===0?"disabled":""}>Back</button><button class="btn pri grow" id="pNext" ${g.over?"disabled":""}>${g.phase===3?(g.round>=mv.len?"Finish game":"End Round "+g.round):"Next: "+PHASES[g.phase+1]}</button><button class="link" id="pMis" style="margin-left:6px">Mission card</button></div>
  ${g.round>=mv.len?`<div class="banner">Final Round: Supply Pool is unlimited. All remaining Reserves may deploy.</div>`:""}</div>`;
  h+=`<div class="panel"><h2>Victory Points <small>${mv.lead?`game ends on a ${mv.lead}+ lead`:"no early-win lead"}</small></h2><div class="vp">
   <div class="box"><div class="note">You</div><div class="n">${g.vp[0]}</div><div class="row"><button class="btn sm" data-vp="0" data-d="-1" aria-label="Your VP minus 1">−1</button><button class="btn sm" data-vp="0" data-d="1" aria-label="Your VP plus 1">+1</button></div></div>
   <div class="box"><div class="note">${g.opp?esc(g.opp.name):"Opponent"}</div><div class="n">${g.vp[1]}</div><div class="row"><button class="btn sm" data-vp="1" data-d="-1" aria-label="Opponent VP minus 1">−1</button><button class="btn sm" data-vp="1" data-d="1" aria-label="Opponent VP plus 1">+1</button></div></div></div>
   ${mv.lead&&Math.abs(lead)>=mv.lead?`<div class="banner">${lead>0?"You lead":"Opponent leads"} by ${Math.abs(lead)}: that meets the special winning condition. The game ends.</div>`:""}
   ${lost?`<div class="banner">You've lost ${lost} Supply this Round, so your opponent scores ${lost} VP for destroyed Supply.</div>`:""}
   ${g.over?`<div class="banner good">Game over. ${lead>0?"You win":lead<0?"Opponent wins":"Draw"} ${g.vp[0]}–${g.vp[1]} (VP difference ${Math.abs(lead)}).</div>`:""}</div>`;
  h+=`<div class="panel"><h2>Cards <small>${rsType?ready+" "+rsType+" ready":""}</small></h2>${g.cards.map((c,i)=>{const t=T(c.id);return `<div class="cardchip ${c.ready?"":"ex"}"><button class="link grow" data-tac="${t.id}">${esc(t.n)}</button><span class="rs">${t.res?t.res[1]+" "+t.res[0]:"Passive"}</span>${t.res?`<button class="btn sm" data-card="${i}">${c.ready?"Exhaust":"Ready"}</button>`:""}</div>`}).join("")}<p class="note">Exhausted cards refresh automatically when you end the Round.</p></div>`;
  const urow=u=>{const ud=U(u.id);const cs=curSupply(u);return `<div class="urow"><div class="hd"><button class="link grow ${u.act?"done":""}" data-show="${u.uid}">${esc(ud.n)}</button><span class="sup" title="Current Supply">S ${cs}${poolSupply(u)!==cs?" (0 pool)":""}</span></div>
   <div class="ctrls"><span class="step"><button data-mod="${u.uid}" data-d="-1" aria-label="Remove a model">−</button><output>${u.models}/${u.max}</output><button data-mod="${u.uid}" data-d="1" aria-label="Add a model back">+</button></span>
   ${u.status==="res"?`<button class="btn sm pri" data-dep="${u.uid}" ${(avail!==Infinity&&poolSupply(u)>avail)?"disabled":""}>Deploy</button>`:""}
   ${u.status==="field"?`<button class="btn sm" data-act="${u.uid}">${u.act?"Activated ✓":"Mark activated"}</button><button class="btn sm" data-toRes="${u.uid}">To Reserves</button>`:""}
   ${u.status==="dead"?`<span class="note">Destroyed</span>`:""}</div></div>`};
  h+=`<div class="panel"><h2>Units <small>${onField} Supply on the battlefield</small></h2>
   <div class="grp">On the battlefield</div>${field.map(urow).join("")||'<p class="note">Nothing deployed yet. Deploy from Reserves in the Movement Phase.</p>'}
   <div class="grp">Reserves</div>${res.map(urow).join("")||'<p class="note">Reserves are empty.</p>'}
   ${dead.length?`<div class="grp">Destroyed</div>`+dead.map(urow).join(""):""}
   <details style="margin-top:8px"><summary>Add a summoned unit</summary><div class="picker" style="margin-top:6px">${UNITS.filter(u=>u.sum&&u.r===g.roster.race).map(u=>`<button class="pick" data-sum="${u.id}"><b>${esc(u.n)}</b><span class="note">Supply 0</span></button>`).join("")}</div></details></div>`;
  if(g.online)h+=oppHTML(g);
  h+=`<div class="panel"><button class="btn danger" id="pEnd">${g.online?"End online game":"End and clear game"}</button>${g.online?`<p class="note">Ends it for both players.</p>`:""}</div>`;
  el.innerHTML=h;if(g.online)renderSyncDot();
}
$("#v-play").addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el)return;const g=st.game,ds=el.dataset;
  if(ds.go){show(ds.go);return}
  if(!g)return;const find=id=>g.units.find(u=>u.uid===+id);
  if(g.online){
    if(el.id==="pCode"){(navigator.clipboard?navigator.clipboard.writeText(g.online.code):Promise.reject()).then(()=>toast("Code copied")).catch(()=>toast("Code: "+g.online.code));return}
    if(el.id==="pClear"){st.game=null;save();renderPlay();return}
    if(ds.showOpp){let ups=[];try{ups=JSON.parse(ds.ups)}catch(e){}showUnit(ds.showOpp,ups);return}
    if(el.id==="pNext"||el.id==="pPrev"){if(g.online.status==="ended")return;sendOps([{op:"step",dir:el.id==="pNext"?1:-1,from:{round:g.round,phase:g.phase}}]);return}
    if(ds.vp!==undefined){const i=+ds.vp;g.vp[i]=Math.max(0,g.vp[i]+(+ds.d));save();renderPlay();sendOps([{op:"vp",side:i===0?g.online.side:otherSide(g.online.side),d:+ds.d}]);return}
    if(el.id==="pEnd"){if(!confirm("End this online game for both players?"))return;api("POST",`/sync/games/${g.online.code}/end`).catch(()=>{});st.game=null;net.games=null;save();renderPlay();return}
  }
  if(el.id==="pNext"){if(g.phase<3){g.phase++;g.units.forEach(u=>u.act=false)}else{const mv=M(g.mission)[g.scale];if(g.round>=mv.len){g.over=true}else{g.round++;g.phase=0;g.cards.forEach(c=>c.ready=true);g.units.forEach(u=>{u.act=false;u.snap=u.status==="field"?curSupply(u):0});toast("Round "+g.round+": cards refreshed")}}}
  else if(el.id==="pPrev"){if(g.phase>0)g.phase--;else if(g.round>1){g.round--;g.phase=3}g.over=false}
  else if(el.id==="pMis"){openModal(M(g.mission).n,missionHTML(M(g.mission),g.scale)+(g.deploy?`<div class="phh">Deployment: ${esc(D(g.deploy).n)}</div><div class="ab">${esc(D(g.deploy).d)}</div>`:""));return}
  else if(el.id==="pEnd"){if(!confirm("Clear this game?"))return;st.game=null}
  else if(ds.vp!==undefined){g.vp[+ds.vp]=Math.max(0,g.vp[+ds.vp]+(+ds.d))}
  else if(ds.card!==undefined){const c=g.cards[+ds.card];c.ready=!c.ready}
  else if(ds.tac){showTac(ds.tac);return}
  else if(ds.show){const u=find(ds.show);showUnit(u.id,u.ups);return}
  else if(ds.mod){const u=find(ds.mod);u.models=Math.max(0,Math.min(u.max,u.models+(+ds.d)));if(u.models===0)u.status="dead";else if(u.status==="dead")u.status="field"}
  else if(ds.dep){const u=find(ds.dep);u.status="field";u.snap=curSupply(u)}
  else if(ds.act){const u=find(ds.act);u.act=!u.act}
  else if(ds.tores!==undefined||ds.toRes){const u=find(ds.tores||ds.toRes);u.status="res";u.snap=0}
  else if(ds.sum){const ud=U(ds.sum);g.units.push({uid:++uidc,id:ud.id,ups:[],models:ud.comps[0][0],max:ud.comps[0][0],startSup:0,status:"field",act:false,snap:0});toast(ud.n+" summoned")}
  else return;
  if(g.online&&st.game===g)queueSide();
  save();renderPlay();
});

const refText=g=>/^\d/.test(g.ref)?`Core Rules ${g.ref.includes(".")?"section":"Part"} ${g.ref}`:esc(g.ref);
let glossStack=[];
function glossBody(g){return `<div class="gcat" style="margin:0">${GL_CATS[g.cat]}</div><p class="gdef">${linkTerms(esc(g.d),{skip:g.id})}</p><div class="note">${refText(g)}</div>${g.see.length?`<div class="note" style="margin-top:6px">See also: ${g.see.map(id=>glb(id,esc(GL(id).n))).join(", ")}</div>`:""}`}
function openGloss(id){const g=GL(id);if(!g)return;const d=$("#gloss");
  if(d.open&&d.dataset.id&&d.dataset.id!==id)glossStack.push(d.dataset.id);
  d.dataset.id=id;$("#gTitle").textContent=g.n;$("#gBody").innerHTML=glossBody(g);$("#gBack").hidden=!glossStack.length;
  if(!d.open)d.showModal();$("#gBody").scrollTop=0}
// Capture phase, so a term link never also triggers the view or card it sits in.
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button.gl");if(!b)return;e.preventDefault();e.stopPropagation();openGloss(b.dataset.gl)},true);
$("#gClose").onclick=()=>$("#gloss").close();
$("#gBack").onclick=()=>{const prev=glossStack.pop();const d=$("#gloss");d.dataset.id="";if(prev)openGloss(prev)};

$("#gloss").addEventListener("close",()=>{glossStack=[];$("#gloss").dataset.id=""});

let glossFilter={q:"",cat:""};
function glossMatches(){
  const q=glossFilter.q.trim().toLowerCase();
  let l=GLOSSARY.filter(g=>!glossFilter.cat||g.cat===glossFilter.cat);
  if(!q)return l.slice().sort((a,b)=>a.n.localeCompare(b.n,"en",{sensitivity:"base"}));
  const rank=g=>{const n=g.n.toLowerCase();if(n.startsWith(q))return 0;if(n.includes(q))return 1;if(g.f.some(f=>f.toLowerCase().includes(q)))return 2;if(g.d.toLowerCase().includes(q))return 3;return 9};
  return l.map(g=>[rank(g),g]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].n.localeCompare(b[1].n)).map(x=>x[1]);
}
function renderGlossList(){
  const l=glossMatches(),grouped=!glossFilter.q.trim();let h="",last="";
  l.forEach(g=>{const letter=g.n[0].toUpperCase();if(grouped&&letter!==last){h+=`<div class="gletter">${letter}</div>`;last=letter}
    h+=`<div class="gitem" id="gl-${g.id}"><h3>${esc(g.n)}<small>${GL_CATS[g.cat]}</small></h3><p class="gdef">${linkTerms(esc(g.d),{skip:g.id})}</p><div class="note">${refText(g)}</div></div>`});
  $("#gList").innerHTML=`<h2>${l.length} term${l.length===1?"":"s"}</h2>`+(h||'<p class="note">No matching terms. Try a shorter search.</p>');
}
function renderGloss(){
  $("#v-gloss").innerHTML=`<div class="panel"><label class="f" for="gQ">Search the glossary</label><input type="search" id="gQ" value="${esc(glossFilter.q)}" placeholder="e.g. Engaged, PIERCE, Surge" autocomplete="off" spellcheck="false">
  <div class="chips" role="group" aria-label="Filter by type">${[["","All"],...Object.entries(GL_CATS)].map(([k,v])=>`<button data-gc="${k}" aria-pressed="${glossFilter.cat===k}">${v}</button>`).join("")}</div>
  <p class="note" style="margin-bottom:0">Plain-English summaries for quick reference at the table. The Core Rules are the final word, so each entry says where to look. Tip: tap any dotted-underlined term on a card to see its meaning.</p></div><div class="panel" id="gList"></div>`;
  renderGlossList();
}
$("#v-gloss").addEventListener("input",e=>{if(e.target.id==="gQ"){glossFilter.q=e.target.value;renderGlossList()}});
$("#v-gloss").addEventListener("click",e=>{const b=e.target.closest("button[data-gc]");if(!b)return;glossFilter.cat=b.dataset.gc;const q=$("#gQ").value;renderGloss();if(q)$("#gQ").focus()});

/* ===================== ACCOUNT, SYNC AND ONLINE PLAY =====================

const net={available:false,user:null,status:"",rstatus:"",busy:false,sidePending:false,sideSeq:0,games:null,lastPull:0};
async function api(method,path,body){
  const r=await fetch(path,{method,credentials:"same-origin",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok||!data){const err=new Error((data&&data.error)||`Server error (${r.status})`);err.status=r.status;throw err}
  return data;
}

async function syncRosters(manual){
  if(!net.user)return;
  try{
    const {rosters:remote}=await api("GET","/sync/rosters");
    const m=mergeRosters(st.rosters,st.tomb,remote);
    st.rosters=m.rosters.map(r=>cleanBuild(r,[],""));
    for(const r of m.push)await api("PUT","/sync/rosters/"+encodeURIComponent(r.id),{data:r,updated:r.updated||Date.now()});
    for(const id of m.drop)await api("DELETE","/sync/rosters/"+encodeURIComponent(id)+"?t="+(st.tomb[id]||Date.now()));
    st.tomb={};net.lastPull=Date.now();net.rstatus="Synced "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});

  }catch(err){net.rstatus="Not synced: "+err.message;if(manual)toast(net.rstatus)}
}

function exportRosters(which){

// Rosters already saved here aren't added silently: list them and offer to
// import them as new copies. opts.load loads the first imported roster (share links).
let pendingImport=null;
function finishImport(r,opts){
  opts=opts||{};
  if(r.dupes&&r.dupes.length&&!r.decided){
    pendingImport={r,opts};const n=r.dupes.length;
    openModal("Already saved",`<p>${n===1?"This roster appears":`These ${n} rosters appear`} to be saved here already:</p><ul>${r.dupes.map(d=>`<li>${esc(d.name)}</li>`).join("")}</ul><p>Save ${n===1?"it":"them"} as new roster${n===1?"":"s"} anyway?</p>${r.rosters.length?`<p class="note">${r.rosters.length} other roster${r.rosters.length===1?"":"s"} in the file will be imported either way.</p>`:""}
    <div class="row"><button class="btn pri" data-dupes="new">Save as new</button><button class="btn" data-dupes="skip">Skip ${n===1?"it":"them"}</button></div>`);
    return;
  }
  st.rosters.push(...r.rosters);r.rosters.forEach(pushRoster);
  if(opts.load&&r.rosters[0]){st.build=JSON.parse(JSON.stringify(r.rosters[0]));save();show("build")}else{save();renderBuild()}
  const msg=r.rosters.length?`${r.rosters.length} roster${r.rosters.length===1?"":"s"} imported${r.skipped?`, ${r.skipped} skipped`:""}.`:"Nothing new imported.";
  if(r.notes.length)openModal("Import",`<p>${msg}</p><p>Some entries didn't match the current cards and were left out:</p><ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`);
  else{if($("#modal").open)$("#modal").close();toast(msg)}
}
$("#mBody").addEventListener("click",e=>{
  const el=e.target.closest("[data-export],[data-dupes]");if(!el)return;
  if(el.dataset.export){exportRosters(el.dataset.export);return}
  if(!pendingImport)return;const {r,opts}=pendingImport;pendingImport=null;r.decided=true;
  if(el.dataset.dupes==="new"){r.rosters.push(...asNewCopies(r.dupes,st.rosters.concat(r.rosters)));r.skipped=0}
  finishImport(r,opts);
});
function importFile(file){

async function hostGame(r,mission,deploy){

  const res=await api("POST","/sync/games",{roster:r,units:side.units,cards:side.cards,mission,deploy,scale,len:M(mission)[scale].len});
  st.game=gameFromRemote(res);save();net.games=null;show("play");

async function joinGame(code,r){
  const side=gameSide(JSON.parse(JSON.stringify(r)));
  const res=await api("POST",`/sync/games/${encodeURIComponent(code.trim().toUpperCase())}/join`,{roster:r,units:side.units,cards:side.cards});
  st.game=gameFromRemote(res);save();net.games=null;show("play");toast("Joined game "+res.code);

async function loadGames(){if(!net.user)return;try{net.games=(await api("GET","/sync/games")).games}catch(e){net.games=[]}if($("#v-setup").classList.contains("on"))renderSetup()}

// One request at a time, in order, so ops never overtake each other.
let opChain=Promise.resolve();
function sendOps(ops){
  const g=st.game;if(!g||!g.online)return;const code=g.online.code;
  const seq=net.sideSeq,hasSide=ops.some(o=>o.op==="side");
  opChain=opChain.then(async()=>{
    net.busy=true;
    try{const res=await api("POST",`/sync/games/${code}/ops`,{ops});if(hasSide&&seq===net.sideSeq)net.sidePending=false;net.status="ok";receive(res)}
    catch(err){net.status="offline";if(!hasSide)toast("Not synced: "+err.message);renderSyncDot()}
    finally{net.busy=false}
  });
}
// My own units/cards changed: upload them shortly (several taps go as one).
function queueSide(){net.sidePending=true;net.sideSeq++;clearTimeout(queueSide.h);queueSide.h=setTimeout(()=>{queueSide.h=0;const g=st.game;if(g&&g.online)sendOps([{op:"side",units:g.units,cards:g.cards}])},350)}
function receive(res){
  const g=st.game;if(!g||!g.online||res.code!==g.online.code||res.same)return;
  if(applyRemoteState(g,res,net.sidePending))queueSide();
  save();if($("#v-play").classList.contains("on"))renderPlay();
}
async function poll(){
  const g=st.game;if(!g||!g.online||net.busy||document.hidden||g.online.status==="ended")return;
  try{
    if(net.sidePending&&!queueSide.h)queueSide();
    const res=await api("GET",`/sync/games/${g.online.code}?v=${g.online.v}`);net.status="ok";
    if(!res.same)receive(res);else renderSyncDot();
  }catch(err){net.status=err.status===404?"gone":"offline";renderSyncDot()}
}
function renderSyncDot(){const d=$("#syncDot");if(!d)return;const s=net.status;d.className="dot "+(s==="ok"?"ok":s==="offline"?"bad":"");d.title=s==="ok"?"Synced":s==="offline"?"Can't reach the server, retrying":s==="gone"?"Game not found":"Connecting"}
setInterval(poll,3000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;poll();if(net.user&&Date.now()-net.lastPull>30000)syncRosters()});

function priorityText(a,b,aName,bName){
  try{const ta=totals(a),tb=totals(b);
    return ta.gas<tb.gas?`${aName} take${aName==="You"?"":"s"} priority (less Vespene Gas).`:ta.gas>tb.gas?`${bName} takes priority (less Vespene Gas).`:ta.min<tb.min?`Gas tied: ${aName} take${aName==="You"?"":"s"} priority (fewer Minerals).`:ta.min>tb.min?`Gas tied: ${bName} takes priority (fewer Minerals).`:"Both tied: Roll-Off for priority."}catch(e){return ""}
}
// Header strip for an online game on the Play tab.
function onlineHeaderHTML(g){
  const o=g.opp;const ended=g.online.status==="ended";
  let h=`<div class="panel online"><div class="row" style="align-items:center"><span id="syncDot" class="dot"></span><div class="grow"><b>Online game ${esc(g.online.code)}</b><div class="note">${o?`vs ${esc(o.name)}`:"Waiting for your opponent to join"}</div></div>${o?avatarHTML(o,28):`<button class="btn sm" id="pCode">Copy code</button>`}</div>`;
  if(!o)h+=`<p class="note">Send your opponent the code <b class="code">${esc(g.online.code)}</b>. They sign in, choose their roster on the Setup tab and tap <b>Join</b>. You can start playing now; their army appears when they join.</p>`;
  else{const p=priorityText(g.roster,o.roster||{units:[],tac:{}},"You",o.name);if(p&&g.round===1&&g.phase===0)h+=`<div class="banner">${esc(p)}</div>`}
  if(ended)h+=`<div class="banner">This online game was ended. <button class="link" id="pClear">Remove it from this device</button></div>`;
  return h+`</div>`;
}
function oppHTML(g){
  const o=g.opp;if(!o)return"";
  const units=arr(o.units).filter(u=>u&&U(u.id)),cards=arr(o.cards).filter(c=>c&&T(c.id));
  const lost=units.reduce((a,u)=>a+Math.max(0,(u.snap||0)-curSupply(u)),0);
  const grp=(t,l)=>l.length?`<div class="grp">${t}</div>`+l.map(u=>`<div class="urow opp"><div class="hd"><button class="link grow ${u.act?"done":""}" data-show-opp="${esc(u.id)}" data-ups="${esc(JSON.stringify(arr(u.ups)))}">${esc(U(u.id).n)}</button><span class="sup">${u.models}/${u.max} · S ${curSupply(u)}</span>${u.act?'<span class="tag">Activated</span>':""}</div></div>`).join(""):"";
  return `<div class="panel"><h2>${esc(o.name)}'s army <small>${o.roster&&RACES[o.roster.race]?RACES[o.roster.race]:""}</small></h2>
   ${cards.length?`<div class="chips">${cards.map(c=>{const t=T(c.id);return `<button class="chip ${c.ready||!t.res?"":"ex"}" data-tac="${t.id}">${esc(t.n)}${t.res?(c.ready?"":" · exhausted"):""}</button>`}).join("")}</div>`:""}
   ${lost?`<div class="banner good">${esc(o.name)} has lost ${lost} Supply this Round, so you score ${lost} VP for destroyed Supply.</div>`:""}
   ${grp("On the battlefield",units.filter(u=>u.status==="field"))}${grp("Reserves",units.filter(u=>u.status==="res"))}${grp("Destroyed",units.filter(u=>u.status==="dead"))}</div>`;
}

// Boot: find out if there's a server and who's signed in, then handle links.
async function netInit(){
  // No server behind the offline file copy or the github.io mirror, so don't ask.
  const hasServer=/^https?:$/.test(location.protocol)&&!/\.github\.io$/.test(location.hostname);
  if(hasServer)try{const me=await api("GET","/auth/me");net.available=true;net.user=me.user}catch(e){net.available=false}
  renderAcctBtn();
  const hash=location.hash;
  if(/^#(signed-in|signin-error=|share=)/.test(hash))history.replaceState(null,"",location.pathname+location.search);
  if(hash.startsWith("#signin-error="))toast(decodeURIComponent(hash.slice(14)));
  if(net.user){if(hash==="#signed-in")toast("Signed in as "+net.user.name);await syncRosters();loadGames();if(isOnline())poll()}
  if(hash.startsWith("#share="))openShare(hash.slice(7));
  rerenderCurrent();
}
$("#acctBtn").addEventListener("click",openAccount);
// A share link opened in a tab that already has the app: only the #hash changes.
window.addEventListener("hashchange",()=>{if(location.hash.startsWith("#share=")){const c=location.hash.slice(7);history.replaceState(null,"",location.pathname+location.search);openShare(c)}});

function onlineSetupHTML(r,mis){
  if(!net.available)return"";
  if(!net.user)return `<div class="panel"><h2>Play online</h2><p class="note" style="margin-top:0">Sign in with Discord to host or join an online game. Both players see the same Round, Phase and score, and each other's armies, live.</p><button class="btn" id="sSignIn">Sign in</button></div>`;
  if(net.games===null)loadGames();
  const gl=net.games||[];
  return `<div class="panel"><h2>Play online</h2>
   <p class="note" style="margin-top:0">Host with this roster, Mission and Deployment, then send your opponent the code. Both players see the same Round, Phase and score, and each other's armies.</p>
   <button class="btn pri" id="sHost" ${(!mis||!r.units.length)?"disabled":""}>Host online game</button>
   <div class="grp">Join a game</div><div class="row"><input type="text" id="sCode" maxlength="6" placeholder="CODE" autocomplete="off" autocapitalize="characters" class="grow" aria-label="Game code"><button class="btn" id="sJoin" ${!r.units.length?"disabled":""}>Join</button></div>
   <p class="note">Joins with the roster chosen above. The host's Mission and Deployment are used.</p>
   ${net.games===null?`<p class="note">Loading your online games…</p>`:gl.length?`<div class="grp">Your online games</div>`+gl.map(x=>`<div class="item"><div class="hd"><div class="grow"><b class="code">${esc(x.code)}</b> ${x.opp?`vs ${esc(x.opp)}`:`<span class="note">waiting for opponent</span>`}<div class="meta">${M(x.mission)?esc(M(x.mission).n):""} · ${x.over?"finished":"Round "+x.round}${x.status==="ended"?" · ended":""}</div></div>${x.status==="active"?`<button class="btn sm" data-resume="${esc(x.code)}">${isOnline()&&st.game.online.code===x.code?"Open":"Resume"}</button>`:""}</div></div>`).join(""):""}</div>`;
}

/* ===================== NAV ===================== */
const TITLES={build:"Army builder",setup:"Game setup",play:"Battle tracker",cards:"Card reference",gloss:"Glossary"};
function show(v){document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"true":"false"));document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));$("#title").textContent=TITLES[v];
  ({build:renderBuild,setup:renderSetup,play:renderPlay,cards:renderCards,gloss:renderGloss})[v]();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("#themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+"-theme",r.dataset.theme)}catch(e){}};
try{const th=localStorage.getItem(KEY+"-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
show(st.game?"play":"build");
netInit();
if(loadNotes.length)openModal("Saved data updated",`<p>Some of your saved data pointed at cards that are no longer in the app, probably because a card was renamed or removed in an update. They've been taken out so everything else keeps working:</p><ul>${loadNotes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul><p class="note">Check these rosters against the current cards.</p>`);
</script>
