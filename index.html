<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StarCraft TMG Field Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF3;--panel:#FFFFFF;--panel2:#F2F5F9;--line:#C6D2E0;--text:#13213A;--muted:#56677F;
  --bad:#C0392B;--ok:#1E8A4C;--warn:#B7791F;
  --T:#2F7BCB;--Z:#8E44C2;--P:#C9951A;--acc:var(--T);--accInk:#fff;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1A2B;--panel:#162740;--panel2:#1C3150;--line:#2B4468;--text:#E3EBF5;--muted:#8DA2BE;--T:#4A95E6;--Z:#AE6BE0;--P:#E3B23C;--bad:#F07164;--ok:#48C27E;--warn:#E8B04C}
}
:root[data-theme="dark"]{--bg:#0E1A2B;--panel:#162740;--panel2:#1C3150;--line:#2B4468;--text:#E3EBF5;--muted:#8DA2BE;--T:#4A95E6;--Z:#AE6BE0;--P:#E3B23C;--bad:#F07164;--ok:#48C27E;--warn:#E8B04C}
body[data-race="T"]{--acc:var(--T);--accInk:#fff}
body[data-race="Z"]{--acc:var(--Z);--accInk:#fff}
body[data-race="P"]{--acc:var(--P);--accInk:#1B1404}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--acc);padding:10px 14px 8px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.15rem;flex:1}
header.top .race-mark{width:14px;height:22px;background:var(--acc);clip-path:polygon(0 0,100% 18%,100% 82%,0 100%)}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--muted);position:relative}
nav.tabs button[aria-current="true"]{color:var(--text)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--acc)}
section.view{display:none}section.view.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.panel h2{font-size:1.02rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
select,input[type=text],input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-height:42px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:9px 4px;font-family:var(--display);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accInk)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:9px 13px;min-height:42px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.9rem}
.btn:disabled{opacity:.45}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px;font-weight:600;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* resource bar */
.resbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:4;background:var(--bg);padding:6px 0 8px;margin:-4px 0 8px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.meter .n{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.1}
.meter .n span{font-size:.9rem;color:var(--muted);font-weight:600}
.meter .k{font-size:.8rem;color:var(--muted)}
.meter .bar{height:4px;background:var(--panel2);border-radius:2px;margin-top:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--acc)}
.meter.over .n{color:var(--bad)}.meter.over .bar i{background:var(--bad)}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.slot{font-size:.85rem;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 8px;font-weight:600}
.slot b{font-family:var(--display)}
.slot.over{border-color:var(--bad);color:var(--bad)}
.slot.full{border-color:var(--acc)}
/* items */
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.item .hd{display:flex;gap:8px;align-items:center}
.item .meta{font-size:.85rem;color:var(--muted)}
.cost{font-family:var(--display);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:4px;color:var(--muted)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.step button{border:0;background:var(--panel2);width:36px;height:34px;font-size:1.1rem;font-weight:700}
.step output{min-width:30px;text-align:center;font-family:var(--display);font-weight:700}
.ups{margin-top:8px;display:grid;gap:4px}
.ups label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;padding:4px 0}
.ups input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.issues{list-style:none;padding:0;margin:0}
.issues li{padding:6px 0 6px 18px;position:relative;font-size:.93rem}
.issues li::before{content:"";position:absolute;left:2px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.issues li.ok::before{background:var(--ok)}
.picker{display:grid;gap:6px}
.pick{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);text-align:left;width:100%}
.pick[disabled]{opacity:.5}
.pick .cost{font-size:.95rem}
details>summary{cursor:pointer;font-weight:600;list-style:none;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ ";color:var(--acc);font-family:var(--display)}
details[open]>summary::before{content:"– "}
/* play */
.bigrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.stat .n{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.05}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat.hl{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.phases div{text-align:center;font-family:var(--display);font-weight:600;font-size:.82rem;padding:7px 2px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.phases div.on{background:var(--acc);color:var(--accInk)}
.vp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vp .box{background:var(--panel2);border-radius:6px;padding:8px;text-align:center}
.vp .n{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1}
.vp .row{justify-content:center;margin-top:6px}
.banner{border-left:4px solid var(--warn);background:var(--panel2);padding:8px 10px;border-radius:4px;font-size:.93rem;margin-top:8px}
.banner.good{border-color:var(--ok)}
.cardchip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--panel2)}
.cardchip.ex{opacity:.55;border-style:dashed}
.cardchip .rs{font-family:var(--display);font-weight:700;font-size:.9rem}
.urow{padding:9px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .hd{display:flex;align-items:center;gap:8px}
.urow .ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sup{font-family:var(--display);font-weight:700;background:var(--panel2);border-radius:4px;padding:2px 7px;font-size:.9rem}
.done{text-decoration:line-through;color:var(--muted)}
.grp{font-family:var(--display);font-weight:600;font-size:.9rem;color:var(--muted);margin:10px 0 2px}
.ref{font-size:.92rem}
.ref ul{margin:4px 0;padding-left:18px}
/* modal */
dialog{border:0;padding:0;width:min(680px,100%);max-height:90vh;border-radius:10px 10px 0 0;margin:auto auto 0;background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(5,10,20,.6)}
dialog .mh{position:sticky;top:0;background:var(--panel);border-bottom:3px solid var(--acc);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:1}
dialog .mh h3{flex:1;font-size:1.2rem}
dialog .mb{padding:12px 14px 24px;overflow:auto}
.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0 10px}
.sgrid div{background:var(--panel2);border-radius:4px;text-align:center;padding:5px 2px}
.sgrid b{display:block;font-family:var(--display);font-size:1.15rem}
.sgrid small{font-size:.68rem;color:var(--muted)}
.wt{overflow-x:auto;margin:4px 0 10px}
.wt table{border-collapse:collapse;font-size:.85rem;min-width:520px;width:100%}
.wt th,.wt td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.wt th{color:var(--muted);font-weight:600}
.wt td.kw{white-space:normal;min-width:150px}
.ab{margin:6px 0 8px;font-size:.93rem}
.ab b{font-family:var(--display);font-weight:600}
.kind{font-size:.75rem;font-weight:700;border-radius:3px;padding:0 5px;margin:0 4px;vertical-align:1px;background:var(--panel2);border:1px solid var(--line)}
.phh{font-family:var(--display);font-weight:600;color:var(--acc);margin-top:10px;font-size:.95rem}
.note{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

/* ===================== CALCS ===================== */
function limits(b){const min=b.scale==="go"?(+b.goMin||2001):SCALES[b.scale].min;return {min,gas:Math.floor(min/10)}}
function unitCost(bu){const u=U(bu.id);let c=u.comps[bu.ci][1];(bu.ups||[]).forEach(n=>{const up=u.up.find(x=>x.n===n);if(up)c+=up.c[Math.min(bu.ci,up.c.length-1)]});return c}
function tacSlots(b,id){const t=T(id);return t.unk?(b.tacSlots[id]||{}):t.slots}
function totals(b){
  let min=0,gas=0;const avail={},used={};SLOT_TYPES.forEach(s=>{avail[s]=0;used[s]=0});
  if(b.faction){const f=T(b.faction);SLOT_TYPES.forEach(s=>avail[s]+=f.slots[s]||0)}
  Object.entries(b.tac).forEach(([id,q])=>{const t=T(id);if(!t||!q)return;gas+=t.gas*q;const sl=tacSlots(b,id);SLOT_TYPES.forEach(s=>avail[s]+=(sl[s]||0)*q)});
  b.units.forEach(bu=>{const u=U(bu.id);min+=unitCost(bu);const sl=u.unk?(bu.slot||u.slot):u.slot;used[sl]=(used[sl]||0)+u.comps[bu.ci][2]});
  return {min,gas,avail,used}
}
function eligible(b,tags){if(!b.faction)return true;const ft=T(b.faction).tags;return tags.every(t=>ft.includes(t))}
function issues(b){
  const out=[],L=limits(b),t=totals(b);
  if(!b.faction)out.push("Pick a Faction Card.");
  if(t.min>L.min)out.push(`Minerals over by ${t.min-L.min}.`);
  if(t.gas>L.gas)out.push(`Vespene Gas over by ${t.gas-L.gas}.`);
  SLOT_TYPES.forEach(s=>{if(t.used[s]>t.avail[s])out.push(`${s} slots: using ${t.used[s]} of ${t.avail[s]}. Add a Tactical Card that gives ${s} slots.`)});
  b.units.forEach(bu=>{const u=U(bu.id);if(!eligible(b,u.tags))out.push(`${u.n} needs the ${u.tags.filter(x=>!T(b.faction).tags.includes(x)).join(", ")} tag on your Faction Card.`)});
  Object.keys(b.tac).forEach(id=>{const tc=T(id);if(b.tac[id]&&!eligible(b,tc.tags))out.push(`${tc.n} isn't allowed with this Faction Card.`)});
  const cnt={};b.units.forEach(bu=>{cnt[bu.id]=(cnt[bu.id]||0)+1});Object.entries(cnt).forEach(([id,n])=>{if(U(id).uq&&n>1)out.push(`${U(id).n} is Unique: only one allowed.`)});
  if(b.faction&&b.race==="Z"){const creeps=Object.keys(b.tac).filter(id=>b.tac[id]&&T(id).type==="Creep").length;if(creeps!==1)out.push("Zerg armies must take exactly one Creep Card.")}
  b.units.forEach(bu=>{const u=U(bu.id);const reps={};(bu.ups||[]).forEach(n=>{const up=u.up.find(x=>x.n===n);if(up&&up.rep&&!up.spec){if(reps[up.rep])out.push(`${u.n}: ${reps[up.rep]} and ${n} both replace ${up.rep}; pick one.`);reps[up.rep]=n}})});
  if(b.units.some(bu=>U(bu.id).unk))out.push("Some units have no card in your PDFs; check their Army Slot and tags against the real card.");
  return out;
}
function curSupply(gu){const u=U(gu.id);if(gu.models<=0)return 0;if(!u.prof)return gu.startSup;const p=u.prof.find(p=>gu.models>=p[0]&&gu.models<=p[1]);return p?p[2]:gu.startSup}
function poolSupply(gu){ if(gu.ups&&gu.ups.includes("Advanced Medic Facilities"))return 0; return curSupply(gu)}

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1600)}
function setRace(r){document.body.dataset.race=r}
function kindTag(k){return k?`<span class="kind">${esc(k)}</span>`:""}
function openModal(title,html){$("#mTitle").textContent=title;$("#mBody").innerHTML=html;const d=$("#modal");if(!d.open)d.showModal();$("#mBody").scrollTop=0}
$("#mClose").onclick=()=>$("#modal").close();
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").close()});
function weaponTable(ws){if(!ws.length)return"";return `<div class="wt"><table><thead><tr><th>Weapon</th><th>Rng</th><th>Target</th><th>RoA</th><th>Hit</th><th>Surge</th><th>S Dice</th><th>Dmg</th><th>Keywords</th></tr></thead><tbody>${ws.map(w=>`<tr><td><b>${esc(w.n)}</b>${w.rep?`<br><span class="note">replaces ${esc(w.rep)}</span>`:""}</td><td>${w.rng}</td><td>${w.t}</td><td>${w.roa}</td><td>${w.hit}</td><td>${esc(w.su)}</td><td>${w.sd}</td><td>${w.dmg}</td><td class="kw">${esc(w.kw)}</td></tr>`).join("")}</tbody></table></div>`}
function abilityBlock(abs){const order=["Any","Movement","Assault","Combat"];return order.map(ph=>{const l=abs.filter(a=>a.ph===ph);if(!l.length)return"";return `<div class="phh">${ph==="Any"?"Any phase":ph+" phase"}</div>`+l.map(a=>`<div class="ab"><b>${esc(a.n)}</b>${kindTag(a.k)} ${esc(a.tx)}</div>`).join("")}).join("")}
function unitCardHTML(u,chosenUps){
  if(u.unk)return `<p class="note">This unit is in the September 2026 cost table, but its card isn't in the PDFs you uploaded, so stats and abilities aren't available here. Default slot guess: <b>${u.slot}</b>.</p><div class="phh">Compositions</div>${u.comps.map(c=>`<div class="ab">${c[0]} model${c[0]>1?"s":""}: <b>${c[1]}</b> minerals, Supply ${c[2]}</div>`).join("")}<div class="phh">Upgrades</div>${u.up.map(x=>`<div class="ab"><b>${esc(x.n)}</b> ${x.rep?"(replaces "+esc(x.rep)+") ":""}— ${x.c.join(" / ")}</div>`).join("")||"<div class='note'>None</div>"}`;
  const s=u.st,labels=["Shield","Speed","Armour","Evade","HP","Size"];
  let h=`<div class="sgrid">${s.map((v,i)=>`<div><b>${v}</b><small>${labels[i]}</small></div>`).join("")}</div>`;
  h+=`<div class="note">${esc(u.tags.join(" · "))} &nbsp;|&nbsp; ${esc(u.ct)} &nbsp;|&nbsp; ${u.slot==="—"?"Summoned (no cost, no slot)":u.slot+" slot"} &nbsp;|&nbsp; ${esc(u.role)} &nbsp;|&nbsp; ${u.base}${u.uq?" &nbsp;|&nbsp; Unique":""}</div>`;
  h+=`<div class="note" style="margin-top:4px">Supply by models: ${u.prof.map(p=>`${p[0]===p[1]?p[0]:p[0]+"–"+p[1]}→${p[2]}`).join(", ")}</div>`;
  if(!u.sum)h+=`<div class="note">Buy at: ${u.comps.map(c=>`${c[0]} models ${c[1]}m`).join(" · ")}</div>`;
  h+=abilityBlock(u.ab||[]);
  let ws=(u.wp||[]).slice();
  if(chosenUps){chosenUps.forEach(n=>{const up=u.up.find(x=>x.n===n);if(up&&up.w){if(up.rep&&!up.spec){ws=ws.filter(w=>w.n!==up.rep)}ws.push(Object.assign({},up.w,{rep:up.spec&&up.rep?up.rep+" (one model)":(up.spec?null:null)}))}})}
  const byPh=["Assault","Combat"].map(ph=>{const l=ws.filter(w=>w.ph===ph);return l.length?`<div class="phh">${ph} weapons</div>`+weaponTable(l):""}).join("");
  h+=byPh;
  if(chosenUps&&chosenUps.length){const ab=chosenUps.map(n=>u.up.find(x=>x.n===n)).filter(x=>x&&x.tx);if(ab.length)h+=`<div class="phh">Taken upgrades</div>`+ab.map(a=>`<div class="ab"><b>${esc(a.n)}</b>${kindTag(a.k)} <span class="note">(${a.ph})</span> ${esc(a.tx)}</div>`).join("")}
  if(u.up.length){h+=`<div class="phh">All upgrades</div>`+u.up.map(x=>`<div class="ab"><b>${esc(x.n)}</b> <span class="cost">${x.c.join(" / ")}</span>${x.spec?' <span class="tag">Specialist</span>':""}${kindTag(x.k)} <span class="note">(${x.ph})</span> ${x.tx?esc(x.tx):""}${x.w?weaponTable([Object.assign({},x.w,{rep:x.rep})]):""}</div>`).join("")}
  return h;
}
function tacCardHTML(t){
  let h=`<div class="note">${t.type} card · ${esc(t.tags.join(" · "))}${t.uq?" · Unique":""} · ${t.gas} Vespene Gas${t.res?` · provides ${t.res[1]} ${t.res[0]}`:""}</div>`;
  const sl=Object.entries(t.slots).filter(e=>e[1]).map(e=>`${e[1]}× ${e[0]}`).join(", ");
  h+=`<div class="ab"><b>Army slots:</b> ${sl||(t.unk?"not in your PDFs":"none")}</div>`;
  if(t.unk)h+=`<p class="note">This card is in the cost table but its text isn't in your uploads. Set the slots it gives in the builder from your physical card.</p>`;
  return h+abilityBlock(t.ab);
}
function showUnit(id,ups){const u=U(id);openModal(u.n,unitCardHTML(u,ups))}
function showTac(id){const t=T(id);openModal(t.n,tacCardHTML(t))}
function missionHTML(m,scale){const v=m[scale==="sk"?"sk":"std"];return `<div class="note">${scale==="sk"?"Skirmish":"Standard"} · starting Supply ${v.sup}, +${v.esc} per Round · ${v.len} Rounds · ends early on a ${v.lead}+ VP lead</div><div class="phh">Mission parameters</div><div class="ab">${esc(v.params)}</div><div class="phh">Scoring</div><div class="ab">${esc(v.score)}</div>${v.extra?`<div class="phh">Additional</div><div class="ab">${esc(v.extra)}</div>`:""}`}

/* ===================== BUILD VIEW ===================== */
function renderBuild(){
  const b=st.build;setRace(b.race);const L=limits(b),t=totals(b);
  const facs=TAC.filter(x=>x.r===b.race&&x.type==="Faction");
  const tacs=TAC.filter(x=>x.r===b.race&&x.type!=="Faction");
  const units=UNITS.filter(u=>u.r===b.race&&!u.sum);
  const pct=(a,m)=>Math.min(100,m?a/m*100:0);
  let h=`<div class="panel"><div class="row"><div class="grow"><label class="f" for="bName">Roster name</label><input type="text" id="bName" value="${esc(b.name)}"></div></div>
  <div style="margin-top:10px"><label class="f">Race</label><div class="seg" role="group">${Object.entries(RACES).map(([k,v])=>`<button data-race="${k}" aria-pressed="${b.race===k}">${v}</button>`).join("")}</div></div>
  <div class="row" style="margin-top:10px"><div class="grow"><label class="f" for="bScale">Engagement scale</label><select id="bScale">${Object.entries(SCALES).map(([k,v])=>`<option value="${k}" ${b.scale===k?"selected":""}>${v.n}${k!=="go"?` (${v.min} / ${v.min/10})`:""}</option>`).join("")}</select></div>
  ${b.scale==="go"?`<div style="width:120px"><label class="f" for="bGo">Minerals</label><input type="number" id="bGo" min="2001" step="50" value="${b.goMin}"></div>`:""}</div>
  <div style="margin-top:10px"><label class="f" for="bFac">Faction Card</label><select id="bFac"><option value="">Choose…</option>${facs.map(f=>`<option value="${f.id}" ${b.faction===f.id?"selected":""}>${f.n} — ${Object.entries(f.slots).map(e=>e[1]+" "+e[0]).join(", ")}</option>`).join("")}</select>
  ${b.faction?`<button class="link" style="margin-top:6px" data-tac="${b.faction}">Read ${esc(T(b.faction).n)} card</button>`:""}</div></div>`;
  h+=`<div class="resbar"><div class="meters">
   <div class="meter ${t.min>L.min?"over":""}"><div class="n">${t.min} <span>/ ${L.min}</span></div><div class="k">Minerals · ${L.min-t.min>=0?(L.min-t.min)+" left":"over"}</div><div class="bar"><i style="width:${pct(t.min,L.min)}%"></i></div></div>
   <div class="meter ${t.gas>L.gas?"over":""}"><div class="n">${t.gas} <span>/ ${L.gas}</span></div><div class="k">Vespene Gas · ${L.gas-t.gas>=0?(L.gas-t.gas)+" left":"over"}</div><div class="bar"><i style="width:${pct(t.gas,L.gas)}%"></i></div></div></div>
   <div class="slots">${SLOT_TYPES.map(s=>`<span class="slot ${t.used[s]>t.avail[s]?"over":(t.avail[s]&&t.used[s]===t.avail[s]?"full":"")}">${s} <b>${t.used[s]}/${t.avail[s]}</b></span>`).join("")}</div></div>`;
  // tactical
  h+=`<div class="panel"><h2>Tactical cards <small>${t.gas} gas spent</small></h2>`;
  tacs.forEach(tc=>{const q=b.tac[tc.id]||0;const el=eligible(b,tc.tags);const sl=Object.entries(tc.slots).filter(e=>e[1]).map(e=>`+${e[1]} ${e[0]}`).join(" ");
    h+=`<div class="item"><div class="hd"><div class="grow"><button class="link" data-tac="${tc.id}">${esc(tc.n)}</button><div class="meta">${tc.type==="Creep"?"Creep card":sl||(tc.unk?"slots: set below":"")}${tc.uq?' <span class="tag">Unique</span>':""}${tc.unk?' <span class="tag warn">No card text</span>':""}${!el?' <span class="tag warn">Not allowed with this faction</span>':""}</div></div>
    <span class="cost">${tc.gas}</span><span class="step"><button data-tq="${tc.id}" data-d="-1" aria-label="Remove ${esc(tc.n)}">−</button><output>${q}</output><button data-tq="${tc.id}" data-d="1" aria-label="Add ${esc(tc.n)}" ${(tc.uq&&q>=1)?"disabled":""}>+</button></span></div>
    ${tc.unk&&q?`<div class="row" style="margin-top:6px">${SLOT_TYPES.map(s=>`<label style="font-size:.8rem;width:58px">${s}<input type="number" min="0" max="4" data-ts="${tc.id}" data-s="${s}" value="${(b.tacSlots[tc.id]||{})[s]||0}"></label>`).join("")}</div>`:""}</div>`});
  h+=`</div>`;
  // units
  h+=`<div class="panel"><h2>Units <small>${b.units.length} unit${b.units.length===1?"":"s"}</small></h2>`;
  if(!b.units.length)h+=`<p class="note">Add units from the list below. Each unit fills slots equal to its starting Supply.</p>`;
  b.units.forEach((bu,i)=>{const u=U(bu.id);const ci=bu.ci;
    h+=`<div class="item"><div class="hd"><div class="grow"><button class="link" data-unit="${u.id}" data-bi="${i}">${esc(u.n)}</button><div class="meta">${u.unk?`<select data-uslot="${i}" style="min-height:32px;padding:3px 6px;width:auto">${SLOT_TYPES.map(s=>`<option ${ (bu.slot||u.slot)===s?"selected":""}>${s}</option>`).join("")}</select> slot`:u.slot+" slot"} · Supply ${u.comps[ci][2]}${u.unk?' <span class="tag warn">No card</span>':""}</div></div><span class="cost">${unitCost(bu)}</span><button class="btn sm danger" data-urm="${i}" aria-label="Remove ${esc(u.n)}">✕</button></div>
    ${u.comps.length>1?`<div class="row" style="margin-top:6px"><select data-uci="${i}">${u.comps.map((c,j)=>`<option value="${j}" ${j===ci?"selected":""}>${c[0]} models — ${c[1]} minerals, Supply ${c[2]}</option>`).join("")}</select></div>`:`<div class="meta" style="margin-top:4px">${u.comps[0][0]} model${u.comps[0][0]>1?"s":""} — ${u.comps[0][1]} minerals</div>`}
    ${u.up.length?`<div class="ups">${u.up.map(x=>`<label><input type="checkbox" data-uup="${i}" value="${esc(x.n)}" ${(bu.ups||[]).includes(x.n)?"checked":""}><span class="grow">${esc(x.n)}${x.spec?' <span class="tag">Specialist</span>':""}${x.rep?` <span class="note">replaces ${esc(x.rep)}</span>`:""}</span><span class="cost">+${x.c[Math.min(ci,x.c.length-1)]}</span></label>`).join("")}</div>`:""}</div>`});
  h+=`<details style="margin-top:8px"><summary>Add a unit</summary><div class="picker" style="margin-top:6px">${units.map(u=>{const el=eligible(b,u.tags);return `<button class="pick" data-uadd="${u.id}" ${!el?"disabled":""}><span><b>${esc(u.n)}</b><br><span class="note">${u.unk?"slot unconfirmed":u.slot}${u.uq?" · Unique":""}${!el?" · needs "+u.tags.slice(1).join(", "):""}</span></span><span class="cost">${u.comps.map(c=>c[1]).join(" / ")}</span></button>`}).join("")}</div></details></div>`;
  // missions
  const deps=DEPLOYS.filter(d=>(b.scale==="sk")===(d.sc==="sk"));
  h+=`<div class="panel"><h2>Draft cards <small>2 Missions, 2 Deployments</small></h2>
   <div class="ups">${MISSIONS.map(m=>`<label><input type="checkbox" data-mis="${m.id}" ${b.missions.includes(m.id)?"checked":""}><span class="grow">${m.n}</span></label>`).join("")}</div>
   <div class="grp">Deployments (${b.scale==="sk"?"Skirmish 36×36″":"Standard 54×36″"})</div>
   <div class="ups">${deps.map(d=>`<label><input type="checkbox" data-dep="${d.id}" ${b.deps.includes(d.id)?"checked":""}><span class="grow">${d.n}</span></label>`).join("")}</div></div>`;
  // issues
  const is=issues(b);
  h+=`<div class="panel"><h2>Roster check</h2><ul class="issues">${is.length?is.map(x=>`<li>${esc(x)}</li>`).join(""):'<li class="ok">Roster is legal.</li>'}</ul></div>`;
  h+=`<div class="panel"><div class="row"><button class="btn pri" id="bSave">Save roster</button><button class="btn" id="bCopy">Copy as text</button><button class="btn" id="bNew">New roster</button></div>
  ${st.rosters.length?`<div class="grp">Saved rosters</div>`+st.rosters.map(r=>`<div class="item"><div class="hd"><div class="grow"><b>${esc(r.name)}</b><div class="meta">${RACES[r.race]} · ${SCALES[r.scale].n} · ${totals(r).min} minerals</div></div><button class="btn sm" data-rload="${r.id}">Load</button><button class="btn sm danger" data-rdel="${r.id}" aria-label="Delete ${esc(r.name)}">✕</button></div></div>`).join(""):""}</div>`;
  $("#v-build").innerHTML=h;
}
function rosterText(b){const t=totals(b),L=limits(b);let s=`${b.name}\n${RACES[b.race]} — ${b.faction?T(b.faction).n:"(no faction)"} — ${SCALES[b.scale].n}\nMinerals ${t.min}/${L.min} · Vespene ${t.gas}/${L.gas} · Supply ${b.units.reduce((a,bu)=>a+U(bu.id).comps[bu.ci][2],0)}\n\nUNITS\n`;
  b.units.forEach(bu=>{const u=U(bu.id);s+=`- ${u.n} ×${u.comps[bu.ci][0]} (Supply ${u.comps[bu.ci][2]}, ${unitCost(bu)} min)${bu.ups&&bu.ups.length?" — "+bu.ups.join(", "):""}\n`});
  s+=`\nTACTICAL CARDS\n`;Object.entries(b.tac).forEach(([id,q])=>{if(q)s+=`- ${T(id).n}${q>1?" ×"+q:""} (${T(id).gas*q} gas)\n`});
  s+=`\nMISSIONS: ${b.missions.map(id=>M(id).n).join(", ")||"—"}\nDEPLOYMENTS: ${b.deps.map(id=>D(id).n).join(", ")||"—"}\n`;return s}
function onBuildClick(e){
  const b=st.build,el=e.target.closest("button,input,select");if(!el)return;const ds=el.dataset;
  if(ds.race&&el.tagName==="BUTTON"){if(b.race!==ds.race){if(b.units.length||Object.keys(b.tac).length){if(!confirm("Switching race clears this roster's units and cards. Continue?"))return}Object.assign(b,{race:ds.race,faction:"",tac:{},tacSlots:{},units:[]})}}
  else if(ds.tac){showTac(ds.tac);return}
  else if(ds.unit){const bu=b.units[+ds.bi];showUnit(ds.unit,bu?bu.ups:null);return}
  else if(ds.tq){const id=ds.tq,d=+ds.d;const q=Math.max(0,(b.tac[id]||0)+d);if(T(id).uq&&q>1)return;if(q)b.tac[id]=q;else delete b.tac[id]}
  else if(ds.urm!==undefined){b.units.splice(+ds.urm,1)}
  else if(ds.uadd){const u=U(ds.uadd);b.units.push({uid:++uidc,id:u.id,ci:0,ups:[],slot:u.slot});toast(u.n+" added")}
  else if(el.id==="bSave"){const copy=JSON.parse(JSON.stringify(b));const i=st.rosters.findIndex(r=>r.id===b.id);if(i>=0)st.rosters[i]=copy;else st.rosters.push(copy);toast("Roster saved")}
  else if(el.id==="bCopy"){const txt=rosterText(b);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Roster copied")).catch(()=>openModal("Roster text",`<pre style="white-space:pre-wrap;font:14px/1.4 var(--body)">${esc(txt)}</pre>`));return}
  else if(el.id==="bNew"){st.build=newBuild(b.race);toast("New roster started")}
  else if(ds.rload){st.build=JSON.parse(JSON.stringify(st.rosters.find(r=>r.id===ds.rload)));toast("Roster loaded")}
  else if(ds.rdel){if(!confirm("Delete this saved roster?"))return;st.rosters=st.rosters.filter(r=>r.id!==ds.rdel)}
  else return;
  save();renderBuild();
}
function onBuildChange(e){
  const b=st.build,el=e.target,ds=el.dataset;
  if(el.id==="bName"){b.name=el.value;save();return}
  if(el.id==="bScale"){b.scale=el.value;b.deps=[]}
  else if(el.id==="bGo"){b.goMin=Math.max(2001,+el.value||2001)}
  else if(el.id==="bFac"){b.faction=el.value}
  else if(ds.uci!==undefined){const bu=b.units[+ds.uci];bu.ci=+el.value}
  else if(ds.uslot!==undefined){b.units[+ds.uslot].slot=el.value}
  else if(ds.uup!==undefined){const bu=b.units[+ds.uup];bu.ups=bu.ups||[];if(el.checked){if(!bu.ups.includes(el.value))bu.ups.push(el.value)}else bu.ups=bu.ups.filter(x=>x!==el.value)}
  else if(ds.ts){b.tacSlots[ds.ts]=b.tacSlots[ds.ts]||{};b.tacSlots[ds.ts][ds.s]=Math.max(0,+el.value||0)}
  else if(ds.mis){if(el.checked){if(b.missions.length>=2){el.checked=false;toast("Pick 2 Missions");return}b.missions.push(ds.mis)}else b.missions=b.missions.filter(x=>x!==ds.mis)}
  else if(ds.dep){if(el.checked){if(b.deps.length>=2){el.checked=false;toast("Pick 2 Deployments");return}b.deps.push(ds.dep)}else b.deps=b.deps.filter(x=>x!==ds.dep)}
  else return;
  save();renderBuild();
}
$("#v-build").addEventListener("click",onBuildClick);
$("#v-build").addEventListener("change",onBuildChange);

/* ===================== SETUP VIEW ===================== */
function setupRoster(){return st.setup.rosterId==="current"?st.build:(st.rosters.find(r=>r.id===st.setup.rosterId)||st.build)}
function renderSetup(){
  const su=st.setup,r=setupRoster();setRace(r.race);const t=totals(r);const scale=r.scale==="sk"?"sk":"std";
  const deps=DEPLOYS.filter(d=>(scale==="sk")===(d.sc==="sk"));
  const mis=su.mission?M(su.mission):null,dep=su.deploy?D(su.deploy):null;
  let pr="";if(su.oppGas!==""&&su.oppMin!==""){const og=+su.oppGas,om=+su.oppMin;pr=t.gas<og?"You take priority (less Vespene Gas).":t.gas>og?"Opponent takes priority (less Vespene Gas).":t.min<om?"Gas tied: you take priority (fewer Minerals).":t.min>om?"Gas tied: opponent takes priority (fewer Minerals).":"Both tied: Roll-Off for priority."}
  let h=`<div class="panel"><h2>Your army</h2><label class="f" for="sRos">Roster</label><select id="sRos"><option value="current" ${su.rosterId==="current"?"selected":""}>Current build: ${esc(st.build.name)}</option>${st.rosters.map(x=>`<option value="${x.id}" ${su.rosterId===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
  <p class="note">${RACES[r.race]} · ${SCALES[r.scale].n} · ${t.min} minerals · ${t.gas} gas · ${issues(r).length?"roster has open issues on the Build tab":"legal"}</p></div>`;
  h+=`<div class="panel"><h2>Priority</h2><p class="note" style="margin-top:0">Less Vespene spent takes priority, then fewer Minerals, then Roll-Off. The other player picks the table side the Deployment is read from. Priority picks colour (Red/Blue), then Mission Draft or Deployment Draft control.</p>
  <div class="row"><div class="grow"><label class="f" for="sOG">Opponent gas</label><input type="number" id="sOG" inputmode="numeric" value="${esc(su.oppGas)}"></div><div class="grow"><label class="f" for="sOM">Opponent minerals</label><input type="number" id="sOM" inputmode="numeric" value="${esc(su.oppMin)}"></div></div>
  ${pr?`<div class="banner good">${pr}</div>`:""}
  <details style="margin-top:8px"><summary>Draft steps</summary><div class="ref"><ul><li>Lay out all 4 Mission Cards and all 4 Deployment Cards face-up.</li><li>Mission Draft: the player without control removes 2; the player with control picks 1 of the 2 left.</li><li>Deployment Draft: same, with the other player in control.</li><li>If the draft isn't done 15 minutes into the round, a judge finishes it at random.</li></ul></div></details></div>`;
  h+=`<div class="panel"><h2>Mission and deployment</h2><label class="f" for="sMis">Mission</label><select id="sMis"><option value="">Choose…</option>${MISSIONS.map(m=>`<option value="${m.id}" ${su.mission===m.id?"selected":""}>${m.n}${r.missions.includes(m.id)?" (yours)":""}</option>`).join("")}</select>
  ${mis?`<div style="margin-top:8px">${missionHTML(mis,scale)}</div>`:""}
  <label class="f" for="sDep" style="margin-top:10px">Deployment</label><select id="sDep"><option value="">Choose…</option>${deps.map(d=>`<option value="${d.id}" ${su.deploy===d.id?"selected":""}>${d.n}${r.deps.includes(d.id)?" (yours)":""}</option>`).join("")}</select>
  ${dep?`<p class="ab">${esc(dep.d)}</p><p class="note">Check the printed card for exact Marker positions.</p>`:""}</div>`;
  h+=`<div class="panel"><button class="btn pri" id="sStart" ${(!mis||!r.units.length)?"disabled":""}>Start game</button>${st.game?` <button class="btn" data-go-play>Resume current game</button>`:""}${!mis?`<p class="note">Choose a Mission to start.</p>`:""}</div>`;
  $("#v-setup").innerHTML=h;
}
$("#v-setup").addEventListener("change",e=>{const el=e.target,su=st.setup;
  if(el.id==="sRos"){su.rosterId=el.value;su.deploy=""}else if(el.id==="sMis")su.mission=el.value;else if(el.id==="sDep")su.deploy=el.value;else if(el.id==="sOG")su.oppGas=el.value;else if(el.id==="sOM")su.oppMin=el.value;else return;save();renderSetup()});
$("#v-setup").addEventListener("click",e=>{const el=e.target.closest("button");if(!el)return;
  if(el.id==="sStart"){if(st.game&&!confirm("Replace the game in progress?"))return;startGame();show("play")}
  else if("goPlay" in el.dataset)show("play")});
function startGame(){
  const r=JSON.parse(JSON.stringify(setupRoster()));const scale=r.scale==="sk"?"sk":"std";
  const cards=[];if(r.faction)cards.push({id:r.faction,ready:true});Object.entries(r.tac).forEach(([id,q])=>{for(let i=0;i<q;i++)cards.push({id,ready:true})});
  st.game={roster:r,mission:st.setup.mission,deploy:st.setup.deploy,scale,round:1,phase:0,vp:[0,0],over:false,
    units:r.units.map(bu=>{const u=U(bu.id);const c=u.comps[bu.ci];return {uid:++uidc,id:u.id,ups:bu.ups||[],models:c[0],max:c[0],startSup:c[2],status:"res",act:false,snap:0}}),cards,log:[]};
  save();
}

/* ===================== PLAY VIEW ===================== */
function pool(g){const v=M(g.mission)[g.scale];return g.round>=v.len?Infinity:v.sup+v.esc*(g.round-1)}
function renderPlay(){
  const g=st.game;const el=$("#v-play");
  if(!g){el.innerHTML=`<div class="panel"><h2>No game running</h2><p>Pick a roster and Mission on the Setup tab, then start a game.</p><button class="btn pri" data-go="setup">Go to Setup</button></div>`;return}
  setRace(g.roster.race);const mv=M(g.mission)[g.scale];const P=pool(g);
  const field=g.units.filter(u=>u.status==="field"),res=g.units.filter(u=>u.status==="res"),dead=g.units.filter(u=>u.status==="dead");
  const onField=field.reduce((a,u)=>a+poolSupply(u),0);const avail=P===Infinity?Infinity:P-onField;
  const lost=g.units.reduce((a,u)=>a+Math.max(0,(u.snap||0)-curSupply(u)),0);
  const lead=g.vp[0]-g.vp[1];
  const rsType=g.cards.find(c=>T(c.id).res)?T(g.cards.find(c=>T(c.id).res).id).res[0]:"";
  const ready=g.cards.filter(c=>c.ready&&T(c.id).res).reduce((a,c)=>a+T(c.id).res[1],0);
  let h=`<div class="bigrow"><div class="stat"><div class="n">${g.round}<span style="font-size:1rem;color:var(--muted)">/${mv.len}</span></div><div class="k">Round</div></div>
  <div class="stat hl"><div class="n">${avail===Infinity?"∞":avail}</div><div class="k">Available Supply</div></div>
  <div class="stat"><div class="n">${P===Infinity?"∞":P}</div><div class="k">Supply Pool</div></div></div>`;
  h+=`<div class="panel"><h2>${esc(M(g.mission).n)} <small>${g.deploy?esc(D(g.deploy).n):""}</small></h2>
  <div class="phases">${PHASES.map((p,i)=>`<div class="${i===g.phase?"on":""}">${p.replace(" & Cleanup","")}</div>`).join("")}</div>
  <div class="ref">${PHASE_REF[g.phase]}</div>
  <div class="row" style="margin-top:8px"><button class="btn" id="pPrev" ${g.round===1&&g.phase===0?"disabled":""}>Back</button><button class="btn pri grow" id="pNext" ${g.over?"disabled":""}>${g.phase===3?(g.round>=mv.len?"Finish game":"End Round "+g.round):"Next: "+PHASES[g.phase+1]}</button><button class="link" id="pMis" style="margin-left:6px">Mission card</button></div>
  ${g.round>=mv.len?`<div class="banner">Final Round: Supply Pool is unlimited. All remaining Reserves may deploy.</div>`:""}</div>`;
  h+=`<div class="panel"><h2>Victory Points <small>game ends on a ${mv.lead}+ lead</small></h2><div class="vp">
   <div class="box"><div class="note">You</div><div class="n">${g.vp[0]}</div><div class="row"><button class="btn sm" data-vp="0" data-d="-1" aria-label="Your VP minus 1">−1</button><button class="btn sm" data-vp="0" data-d="1" aria-label="Your VP plus 1">+1</button></div></div>
   <div class="box"><div class="note">Opponent</div><div class="n">${g.vp[1]}</div><div class="row"><button class="btn sm" data-vp="1" data-d="-1" aria-label="Opponent VP minus 1">−1</button><button class="btn sm" data-vp="1" data-d="1" aria-label="Opponent VP plus 1">+1</button></div></div></div>
   ${Math.abs(lead)>=mv.lead?`<div class="banner">${lead>0?"You lead":"Opponent leads"} by ${Math.abs(lead)}: that meets the special winning condition. The game ends.</div>`:""}
   ${lost?`<div class="banner">You've lost ${lost} Supply this Round, so your opponent scores ${lost} VP for destroyed Supply.</div>`:""}
   ${g.over?`<div class="banner good">Game over. ${lead>0?"You win":lead<0?"Opponent wins":"Draw"} ${g.vp[0]}–${g.vp[1]} (VP difference ${Math.abs(lead)}).</div>`:""}</div>`;
  h+=`<div class="panel"><h2>Cards <small>${rsType?ready+" "+rsType+" ready":""}</small></h2>${g.cards.map((c,i)=>{const t=T(c.id);return `<div class="cardchip ${c.ready?"":"ex"}"><button class="link grow" data-tac="${t.id}">${esc(t.n)}</button><span class="rs">${t.res?t.res[1]+" "+t.res[0]:"Passive"}</span>${t.res?`<button class="btn sm" data-card="${i}">${c.ready?"Exhaust":"Ready"}</button>`:""}</div>`}).join("")}<p class="note">Exhausted cards refresh automatically when you end the Round.</p></div>`;
  const urow=u=>{const ud=U(u.id);const cs=curSupply(u);return `<div class="urow"><div class="hd"><button class="link grow ${u.act?"done":""}" data-show="${u.uid}">${esc(ud.n)}</button><span class="sup" title="Current Supply">S ${cs}${poolSupply(u)!==cs?" (0 pool)":""}</span></div>
   <div class="ctrls"><span class="step"><button data-mod="${u.uid}" data-d="-1" aria-label="Remove a model">−</button><output>${u.models}/${u.max}</output><button data-mod="${u.uid}" data-d="1" aria-label="Add a model back">+</button></span>
   ${u.status==="res"?`<button class="btn sm pri" data-dep="${u.uid}" ${(avail!==Infinity&&poolSupply(u)>avail)?"disabled":""}>Deploy</button>`:""}
   ${u.status==="field"?`<button class="btn sm" data-act="${u.uid}">${u.act?"Activated ✓":"Mark activated"}</button><button class="btn sm" data-toRes="${u.uid}">To Reserves</button>`:""}
   ${u.status==="dead"?`<span class="note">Destroyed</span>`:""}</div></div>`};
  h+=`<div class="panel"><h2>Units <small>${onField} Supply on the battlefield</small></h2>
   <div class="grp">On the battlefield</div>${field.map(urow).join("")||'<p class="note">Nothing deployed yet. Deploy from Reserves in the Movement Phase.</p>'}
   <div class="grp">Reserves</div>${res.map(urow).join("")||'<p class="note">Reserves are empty.</p>'}
   ${dead.length?`<div class="grp">Destroyed</div>`+dead.map(urow).join(""):""}
   <details style="margin-top:8px"><summary>Add a summoned unit</summary><div class="picker" style="margin-top:6px">${UNITS.filter(u=>u.sum&&u.r===g.roster.race).map(u=>`<button class="pick" data-sum="${u.id}"><b>${esc(u.n)}</b><span class="note">Supply 0</span></button>`).join("")}</div></details></div>`;
  h+=`<div class="panel"><button class="btn danger" id="pEnd">End and clear game</button></div>`;
  el.innerHTML=h;
}
$("#v-play").addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el)return;const g=st.game,ds=el.dataset;
  if(ds.go){show(ds.go);return}
  if(!g)return;const find=id=>g.units.find(u=>u.uid===+id);
  if(el.id==="pNext"){if(g.phase<3){g.phase++;g.units.forEach(u=>u.act=false)}else{const mv=M(g.mission)[g.scale];if(g.round>=mv.len){g.over=true}else{g.round++;g.phase=0;g.cards.forEach(c=>c.ready=true);g.units.forEach(u=>{u.act=false;u.snap=u.status==="field"?curSupply(u):0});toast("Round "+g.round+": cards refreshed")}}}
  else if(el.id==="pPrev"){if(g.phase>0)g.phase--;else if(g.round>1){g.round--;g.phase=3}g.over=false}
  else if(el.id==="pMis"){openModal(M(g.mission).n,missionHTML(M(g.mission),g.scale)+(g.deploy?`<div class="phh">Deployment: ${esc(D(g.deploy).n)}</div><div class="ab">${esc(D(g.deploy).d)}</div>`:""));return}
  else if(el.id==="pEnd"){if(!confirm("Clear this game?"))return;st.game=null}
  else if(ds.vp!==undefined){g.vp[+ds.vp]=Math.max(0,g.vp[+ds.vp]+(+ds.d))}
  else if(ds.card!==undefined){const c=g.cards[+ds.card];c.ready=!c.ready}
  else if(ds.tac){showTac(ds.tac);return}
  else if(ds.show){const u=find(ds.show);showUnit(u.id,u.ups);return}
  else if(ds.mod){const u=find(ds.mod);u.models=Math.max(0,Math.min(u.max,u.models+(+ds.d)));if(u.models===0)u.status="dead";else if(u.status==="dead")u.status="field"}
  else if(ds.dep){const u=find(ds.dep);u.status="field";u.snap=curSupply(u)}
  else if(ds.act){const u=find(ds.act);u.act=!u.act}
  else if(ds.tores!==undefined||ds.toRes){const u=find(ds.tores||ds.toRes);u.status="res";u.snap=0}
  else if(ds.sum){const ud=U(ds.sum);g.units.push({uid:++uidc,id:ud.id,ups:[],models:ud.comps[0][0],max:ud.comps[0][0],startSup:0,status:"field",act:false,snap:0});toast(ud.n+" summoned")}
  else return;
  save();renderPlay();
});

/* ===================== CARDS VIEW ===================== */
let cardFilter={q:"",race:null};
function renderCards(){
  const race=cardFilter.race||st.build.race;setRace(race);const q=cardFilter.q.toLowerCase();
  const m=x=>!q||x.n.toLowerCase().includes(q);
  const us=UNITS.filter(u=>u.r===race&&m(u)),ts=TAC.filter(t=>t.r===race&&m(t));
  let h=`<div class="panel"><div class="seg" role="group">${Object.entries(RACES).map(([k,v])=>`<button data-cr="${k}" aria-pressed="${race===k}">${v}</button>`).join("")}</div>
  <label class="f" for="cQ" style="margin-top:10px">Search cards</label><input type="text" id="cQ" value="${esc(cardFilter.q)}" placeholder="e.g. Stimpack, Queen, Nexus"></div>`;
  h+=`<div class="panel"><h2>Unit cards</h2><div class="picker">${us.map(u=>`<button class="pick" data-unit="${u.id}"><span><b>${esc(u.n)}</b><br><span class="note">${u.sum?"Summoned":u.slot}${u.unk?" · no card text":""}</span></span><span class="cost">${u.sum?"—":u.comps.map(c=>c[1]).join(" / ")}</span></button>`).join("")||'<p class="note">No matches.</p>'}</div></div>`;
  h+=`<div class="panel"><h2>Faction, tactical and creep cards</h2><div class="picker">${ts.map(t=>`<button class="pick" data-tac="${t.id}"><span><b>${esc(t.n)}</b><br><span class="note">${t.type}${t.uq?" · Unique":""}</span></span><span class="cost">${t.gas} gas</span></button>`).join("")||'<p class="note">No matches.</p>'}</div></div>`;
  h+=`<div class="panel"><h2>Missions</h2><div class="picker">${MISSIONS.filter(m).map(x=>`<button class="pick" data-mis="${x.id}"><b>${x.n}</b><span class="note">Std ${x.std.sup}+${x.std.esc} · Skirm ${x.sk.sup}+${x.sk.esc}</span></button>`).join("")}</div></div>`;
  $("#v-cards").innerHTML=h;
}
$("#v-cards").addEventListener("click",e=>{const el=e.target.closest("button");if(!el)return;const ds=el.dataset;
  if(ds.cr){cardFilter.race=ds.cr;renderCards()}else if(ds.unit)showUnit(ds.unit);else if(ds.tac)showTac(ds.tac);
  else if(ds.mis){const x=M(ds.mis);openModal(x.n,missionHTML(x,"std")+"<hr style='border:0;border-top:1px solid var(--line);margin:12px 0'>"+missionHTML(x,"sk"))}});
$("#v-cards").addEventListener("input",e=>{if(e.target.id==="cQ"){cardFilter.q=e.target.value;const pos=e.target.selectionStart;renderCards();const i=$("#cQ");i.focus();i.setSelectionRange(pos,pos)}});

/* ===================== NAV ===================== */
const TITLES={build:"Army builder",setup:"Game setup",play:"Battle tracker",cards:"Card reference"};
function show(v){document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"true":"false"));document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));$("#title").textContent=TITLES[v];
  ({build:renderBuild,setup:renderSetup,play:renderPlay,cards:renderCards})[v]();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("#themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+"-theme",r.dataset.theme)}catch(e){}};
try{const th=localStorage.getItem(KEY+"-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
show(st.game?"play":"build");
</script>
</body>
</html>
